name: RetroCam
options:
  bundleIdPrefix: com.techmessager
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RetroCam:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    scheme: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RetroCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: RetroCam 需要使用相机来拍照。
        NSPhotoLibraryAddUsageDescription: RetroCam 需要把照片保存到你的相册。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techmessager.retrocam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
