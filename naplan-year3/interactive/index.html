   备份与恢复：进度存在本地浏览器，换设备／换浏览器需要手动搬
   ============================================================ */
const BACKUP_TAG = "chloe-naplan-backup-v1";
function makeBackup() {
  return JSON.stringify({ tag: BACKUP_TAG, at: new Date().toISOString(), lang, data: progress });
}
function backupSummary(o) {
  const d = o.data || {};
  const kps = Object.values(d.kp || {}).filter(x => x.total).length;
  const days = Object.keys((d.plan || {}).done || {}).length;
  return { kps, days, coins: d.coins || 0, wrong: Object.keys(d.wrong || {}).length,
           items: (d.owned || []).length, chapters: d.chapters || 0, at: (o.at || "").slice(0, 10) };
}
function applyBackup(txt) {
  const note = document.getElementById("rsNote");
  let o;
  try { o = JSON.parse(txt); } catch (e) {
    if (note) note.innerHTML = `<span class="bad">✗ ${Tp("这段内容不是有效的备份码", "That is not a valid backup code")}</span>`;
    return;
  }
  if (!o || o.tag !== BACKUP_TAG || !o.data) {
    if (note) note.innerHTML = `<span class="bad">✗ ${Tp("这不是本练习本的备份", "That backup is not from this practice book")}</span>`;
    return;
  }
  const cur = backupSummary({ data: progress }), inc = backupSummary(o);
  if (cur.kps + cur.days > 0 && !confirm(
      Tp("当前设备已有记录（" + cur.kps + " 个知识点 / " + cur.days + " 天）。\n恢复后会被备份里的记录（" + inc.kps + " 个知识点 / " + inc.days + " 天）覆盖。\n确定继续吗？",
         "This device already has progress (" + cur.kps + " topics / " + cur.days + " days).\nRestoring will replace it with the backup (" + inc.kps + " topics / " + inc.days + " days).\nContinue?"))) return;
  progress = o.data;
  for (const k in BLANK) if (progress[k] === undefined) progress[k] = JSON.parse(JSON.stringify(BLANK[k]));
  save();
  if (o.lang) setLang(o.lang);
  location.reload();
}

/* ---------- 大目标：家长设定的真实世界奖励 ---------- */
function goal() {
  if (!progress.goal) progress.goal = { name: "", target: 120, milestones: ["", "", "", ""] };
  return progress.goal;
}
function goalDays() { return activeDays(); }
function goalPct() { const g = goal(); return Math.min(100, Math.round(goalDays() / g.target * 100)); }

function renderGoal() {
  const g = goal(), days = goalDays(), pct = goalPct();
  const marks = [.25, .5, .75, 1];
  const perWeek = 5;
  const weeksLeft = Math.max(0, Math.ceil((g.target - days) / perWeek));
  const eta = new Date(Date.now() + weeksLeft * 7 * 864e5).toISOString().slice(0, 10);

  view.innerHTML = `
    <h2>${T("大目标", "Big Goal")}<span class="en">${Tp("靠坚持赚来的真实奖励", "A real reward, earned by turning up")}</span></h2>
    <p class="lede">${TB("由家长设定一个真正想要的东西，用<strong>学习天数</strong>来解锁 —— 不挂在考试分数上。分数不完全由孩子控制，把大奖绑在分数上只会制造焦虑；坚持是她自己能控制的。",
      "A parent sets something she really wants, unlocked by <strong>days practised</strong> — never by test scores. Scores are not fully in a child's control, and tying a big prize to them just creates anxiety. Turning up is something she controls.")}</p>

    ${g.name ? `
      <div class="goal-card">
        <div class="gc-top">
          <div>
            <div class="gc-k">${T("目标", "Goal")}</div>
            <div class="gc-name">🎁 ${esc(g.name)}</div>
          </div>
          <div class="gc-pct">${pct}%</div>
        </div>
        <div class="goal-bar">
          <i style="width:${pct}%"></i>
          ${marks.map(m => `<span class="gm ${days >= g.target * m ? "hit" : ""}" style="left:${m * 100}%"></span>`).join("")}
        </div>
        <div class="gc-sub">${Tp("已完成 " + days + " / " + g.target + " 个学习日", days + " of " + g.target + " practice days done")}
          ${days < g.target ? " · " + Tp("按每周 5 天，约在 " + eta, "at 5 days a week, about " + eta) : " · 🎉"}</div>

        <div class="gm-list">
          ${marks.map((m, n) => {

              <span class="gm-n">${hit ? "✓" : n + 1}</span>
              <span class="gm-b"><b>${Tp(need + " 天", need + " days")}</b>
                <span>${esc(g.milestones[n] || (n === 3 ? g.name : Tp("（未设定小奖励）", "(no reward set)")))}</span></span>
              <span class="gm-s">${hit ? T("已解锁", "unlocked") : Tp("还差 " + (need - days) + " 天", (need - days) + " to go")}</span>
            </div>`;
          }).join("")}
        </div>
      </div>` : `<div class="panel"><p class="sub" style="margin:0">${T("还没设定目标。在下面填一个她真正想要的东西。", "No goal yet. Set one below — something she genuinely wants.")}</p></div>`}

    <p class="eyebrow">${T("家长设置", "Parent settings")}</p>
    <div class="panel">
      <label class="fld"><span>${T("大奖是什么", "What is the big reward?")}</span>
        <input id="gName" type="text" value="${esc(g.name)}" placeholder="${Tp("例如：3D 打印机", "e.g. a 3D printer")}"></label>
      <label class="fld"><span>${T("需要多少个学习日", "How many practice days?")}</span>
        <input id="gTarget" type="number" min="20" max="400" value="${g.target}"></label>
      <div class="fld-row">
        ${[0, 1, 2, 3].map(n => `<label class="fld"><span>${Tp("第 " + (n + 1) + " 档小奖励", "Milestone " + (n + 1))}</span>
          <input id="gm${n}" type="text" value="${esc(g.milestones[n] || "")}" placeholder="${
            Tp(["一次冰淇淋", "一本新书", "一次看电影", "大奖"][n], ["an ice cream", "a new book", "a movie trip", "the big one"][n])}"></label>`).join("")}
      </div>
      <div class="q-nav"><button class="btn" id="saveGoal">${Tp("保存", "Save")}</button></div>
      <p class="sub" style="margin:14px 0 0">${TB("<strong>为什么建议 120 天：</strong>每周 5 天，120 个学习日大约是 6 个月，正好覆盖到考试。中间四档小奖励很重要 —— 七岁孩子撑不住一个半年后才兑现的承诺，中途要有看得见的兑现。",
        "<strong>Why 120 days:</strong> at 5 days a week that is about six months, which carries her right through to the test. The four milestones matter — a seven-year-old cannot run on a promise that only pays out half a year later, so something has to land along the way.")}</p>

function saveGoal() {
  const g = goal();
  g.name = document.getElementById("gName").value.trim();
  g.target = Math.max(20, Math.min(400, +document.getElementById("gTarget").value || 120));
  g.milestones = [0, 1, 2, 3].map(n => document.getElementById("gm" + n).value.trim());
  save(); renderGoal();
}

function setPreview(st) {
  const real = progress.look;
  progress.look = Object.assign({}, look(), st.pick);
  const svg = avatarSvg(72);
  progress.look = real;
  return svg;
}
function buySet(id) {
  const st = SETS.find(x => x.id === id); if (!st) return;
  const own = owned(), pr = setPrice(st);
  const all = Object.values(st.pick).every(i => own.includes(i));
  if (!all) {
    if (!spendCoins(pr)) {
      const el = document.querySelector(`[data-set="${id}"]`);
      if (el) { el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 450); }
      return;
    }
    Object.values(st.pick).forEach(i => { if (!own.includes(i)) own.push(i); });
  }
  Object.entries(st.pick).forEach(([c, i]) => { look()[c] = i; });
  save(); updateCoinUI(); renderShop();
}

/* 商店缩略图：临时套用该项后渲染小图 */
function previewSvg(cat, id) {
  const real = progress.look;
  progress.look = Object.assign({}, look(), { [cat]: id });
  const svg = avatarSvg(64);
  progress.look = real;
  return svg;
}

function buyOrWear(cat, id, price) {
  const own = owned();
  if (!own.includes(id)) {
    if (!spendCoins(price)) {
      const el = document.querySelector(`[data-buy="${cat}:${id}:${price}"]`);
      if (el) { el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 450); }
      return;
    }
    own.push(id);
  }
  look()[cat] = id;
  save(); updateCoinUI(); renderShop();
}

function renderMap() {

    <div class="flow-q">${i + 1}. ${T(esc(f.q), esc(f.qe))}</div>
    <div class="flow-yes"><b>${Tp("是","Yes")} → ${T(esc(f.yes[0]), esc(f.yesEn[0]))}</b><span>${TB(esc(f.yes[1]), esc(f.yesEn[1]))}</span></div>
    ${i < TEXT_FLOW.length - 1 ? `<div class="flow-arrow">${Tp("否 ↓ 继续问下一个","No ↓ ask the next one")}</div>` : ""}`).join("");

  view.innerHTML = `
    <h2>${T("知识框架","Knowledge Outline")}<span class="en">${ZH("知识大纲") || "Outline"}</span></h2>
    <p class="lede">${TB("四科知识点全貌。<strong style=\"color:var(--coral)\">红色</strong>标出的是最容易失分的地方 —— 这些要重点练。学完一块，就在纸质资料《知识框架图.md》的打勾表上打一个勾。",
      "Everything the four papers cover. The items in <strong style=\"color:var(--coral)\">red</strong> are where marks are most often lost — give those extra practice. Tick each block off in the paper workbook as you finish it.")}</p>

    ${MAPS.map(m => `
      <p class="eyebrow">${TX(m.title)}</p>
      <div class="tree" style="--acc:var(--${m.acc});--acc-soft:var(--${m.acc}-soft)">
        <div class="tree-root">${TX(m.root)}<small>${TX(m.sub)}</small></div>
        <div class="branches">
          ${m.branches.map(b => `
            <div class="branch">
              <div class="branch-head">${TX(b.h)}${b.m ? `<em>${TX(b.m)}</em>` : ""}</div>
              <ul class="leaves">
                ${b.l.map(x => `<li class="${x[2] ? "hot" : ""}"><b>${TX(x[0])}</b><span>${TXB(x[1])}</span></li>`).join("")}
              </ul>
            </div>`).join("")}
        </div>
      </div>`).join("")}

    <p class="eyebrow">${T("阅读：一篇文章是什么文体？照这个顺序问","Reading: which text type is this? Ask in this order")}</p>
    <div class="tree" style="--acc:var(--sky);--acc-soft:var(--sky-soft)">
      <div class="flow">${flow}</div>
      <div class="flow-arrow" style="padding-left:0;margin-top:10px">${Tp("四个都答「否」 ↓","No to all four ↓")}</div>
      <div class="flow-yes"><b>${T("Information Report 说明文","Information Report")}</b><span>${TB("考：找具体事实 · 小标题作用 · 图表信息","Asks about: finding facts · what headings do · reading tables")}</span></div>
    </div>

    <p class="eyebrow">${T("高频失分点 TOP 6","Top 6 places marks are lost")}</p>
    <div class="panel scroll-x">
      <table>
        <thead><tr><th class="num">#</th><th>${T("失分点","Where marks go")}</th><th>${T("去哪练","Practise here")}</th></tr></thead>
        <tbody>${HOT_SPOTS.map((h, i) =>
          `<tr><td class="num">${i + 1}</td><td>${T(esc(h[0]), esc(h[2]))}</td><td>${T(esc(h[1]), esc(h[3]))}</td></tr>`).join("")}

}

/* ---------- router ---------- */
function render() {
  renderTabs();
  updateRing();
  if (current === "today") renderToday();
  else if (current === "graph") renderGraph();
  else if (current === "map") renderMap();
  else if (current === "writing") renderWriting();
  else if (current === "train") renderTrain();
  else if (current === "wrong") renderWrong();
  else if (current === "shop") renderShop();
  else if (current === "goal") renderGoal();
  else if (current === "backup") renderBackup();
  else if (current === "rewards") renderRewards();
  else if (current === "coach") renderCoach();
  else if (current === "progress") renderProgress();
  else renderSubject(current);
  window.scrollTo({ top: 0 });
}

function updateRing() {
  let r = 0, t = 0;
  Object.values(progress.kp).forEach(s => { r += s.right || 0; t += s.total || 0; });
  const pct = t ? Math.round(r / t * 100) : 0;
  const arc = document.getElementById("ringArc");
  arc.setAttribute("stroke-dashoffset", String(113 - 113 * pct / 100));
  document.getElementById("ringPct").textContent = pct + "%";
}

function leave() {
  stopWTimer();
  if (drill) { clearInterval(drill.tId); drill = null; }
  if (exam) { clearInterval(exam.tId); exam = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  dict = null; review = null;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-tab2],[data-quiz],[data-back],[data-pick],[data-next],[data-retry],[data-prompt],[data-dict],[data-play],[data-dcheck],[data-dreveal],[data-dnext],[data-drill],[data-key],[data-quitdrill],[data-exam],[data-epick],[data-emove],[data-esubmit],[data-quitexam],[data-review],[data-rpick],[data-rnext],[data-node],[data-gfilter],[data-gclear],[data-lang],[data-go],[data-buy],[data-set],[data-rtab],[data-teach],#saveGoal,#wtStart,#wtStop,#bkCopy,#rsGo,#syGo,#syUse,#syCopy,#syOff,#resetBtn,#themeBtn");
  if (!t) return;

  if (t.dataset.lang) { setLang(t.dataset.lang); leave(); render(); return; }
  if (t.id === "themeBtn") {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark" ||
      (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", isDark ? "light" : "dark");
    return;
  }
  if (t.dataset.rtab) { rewardTab = t.dataset.rtab; renderRewards(); return; }
  if (t.dataset.teach) { const [a, b2] = t.dataset.teach.split("::"); markTaught(a, b2); return; }
  if (t.id === "bkCopy") {
    const ta = document.getElementById("bkText");
    ta.select(); ta.setSelectionRange(0, 999999);
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    if (navigator.clipboard) { try { navigator.clipboard.writeText(ta.value); done = true; } catch (e) {} }
    document.getElementById("bkNote").innerHTML = done
      ? `<span class="ok">✓ ${Tp("备份码已复制，发给自己保存好","Code copied — send it to yourself and keep it safe")}</span>`
      : Tp("请手动全选下面的文字复制。", "Select the text below and copy it manually.");
    progress.lastBackup = new Date().toISOString(); progress.needBackup = 0; save();
    return;
  }
  if (t.id === "syGo") {
    testSync({ url: document.getElementById("syUrl").value.trim(),
               key: document.getElementById("syKey").value.trim(),
               code: document.getElementById("syCode").value.trim() }).then(() => renderBackup());
    return;
  }
  if (t.id === "syUse") {
    const c = unpackCfg(document.getElementById("syPaste").value);
    if (!c) { document.getElementById("syNote").innerHTML = `<span class="bad">✗ ${Tp("连接码无效","That connection code is not valid")}</span>`; return; }
    testSync(c).then(() => renderBackup());
    return;
  }
  if (t.id === "syCopy") {
    const ta = document.getElementById("syPack"); ta.select(); ta.setSelectionRange(0, 999999);
    try { document.execCommand("copy"); } catch (e) {}
    if (navigator.clipboard) { try { navigator.clipboard.writeText(ta.value); } catch (e) {} }
    document.getElementById("syNote").innerHTML = `<span class="ok">✓ ${Tp("连接码已复制","Connection code copied")}</span>`;
    return;
  }
  if (t.id === "syOff") { saveSyncCfg(null); syncState.on = false; paintSync(); renderBackup(); return; }
  if (t.id === "rsGo") { applyBackup(document.getElementById("rsText").value.trim()); return; }
  if (t.id === "wtStart") { startWTimer(); return; }
  if (t.id === "wtStop") { stopWTimer(); renderWriting(); return; }
  if (t.id === "saveGoal") { saveGoal(); return; }
  if (t.dataset.set) { buySet(t.dataset.set); return; }
  if (t.dataset.buy) { const [c, i, pr] = t.dataset.buy.split(":"); buyOrWear(c, i, +pr); return; }
  if (t.dataset.go) {
    const g = JSON.parse(t.dataset.go);
    leave();
    if (g.drill) { current = "train"; renderTabs(); startDrill(g.drill.split(",").map(Number)); }
    else if (g.quiz) { current = g.quiz; renderTabs(); startQuiz(g.quiz, g.kp); }
    else if (g.review) { current = "wrong"; renderTabs(); startReview(); }
    else if (g.dict !== undefined) { current = "train"; renderTabs(); startDict(g.dict); }
    else if (g.exam) { current = "train"; renderTabs(); const a = g.exam.split(","); startExam(a[0], +a[1], +a[2]); }
    else if (g.tab) { current = g.tab; render(); }
    window.scrollTo({ top: 0 });
    return;
  }
  if (t.dataset.tab) { leave(); current = t.dataset.tab; render(); return; }
  if (t.dataset.tab2) { leave(); current = t.dataset.tab2; render(); return; }
  if (t.dataset.quiz) {
    leave();
    current = t.dataset.quiz;
    renderTabs();
    startQuiz(t.dataset.quiz, t.dataset.kp);
    window.scrollTo({ top: 0 });
    return;
  }
  if (t.dataset.back) { leave(); current = t.dataset.back; render(); return; }
  if (t.dataset.pick !== undefined) { pick(+t.dataset.pick); return; }
  if (t.dataset.next) { next(); return; }
  if (t.dataset.retry) { startQuiz(quiz.subj, quiz.kp); return; }
  if (t.dataset.prompt) { showPrompt(t.dataset.prompt); return; }

  /* 听写 */
  if (t.dataset.dict) { current = "train"; renderTabs(); startDict(+t.dataset.dict); return; }
  if (t.dataset.play) { playDict(); return; }
  if (t.dataset.dcheck) { checkDict(); return; }
  if (t.dataset.dreveal) {
    const w = dict.words[dict.i];
    document.getElementById("dictVerdict").innerHTML =
      `<div class="verdict"><b>家长报词：${esc(w[0])}</b><p><em>${esc(w[1])}</em></p>
       <span class="src">请把单词读两遍、例句读一遍，然后让孩子拼写</span></div>`;
    return;
  }
  if (t.dataset.dnext) { nextDict(); return; }

  /* 口诀 */
  if (t.dataset.drill) { leave(); current = "train"; renderTabs(); startDrill(t.dataset.drill.split(",").map(Number)); return; }
  if (t.dataset.key) { drillKey(t.dataset.key); return; }
  if (t.dataset.quitdrill) { finishDrill(); return; }

  /* 限时测验 */
  if (t.dataset.exam) {
    leave(); current = "train"; renderTabs();
    const [s, n, m] = t.dataset.exam.split(",");
    startExam(s, +n, +m);
    return;
  }
  if (t.dataset.epick !== undefined) {
    exam.picks[exam.i] = +t.dataset.epick;
    renderExam();
    return;
  }
  if (t.dataset.emove) {
    exam.i = Math.min(Math.max(0, exam.i + +t.dataset.emove), exam.qs.length - 1);
    renderExam(); window.scrollTo({ top: 0 });
    return;
  }
  if (t.dataset.esubmit) { finishExam(); return; }
  if (t.dataset.quitexam) { finishExam(); return; }

  /* 知识图谱 */
  if (t.dataset.gfilter) { graphFilter = t.dataset.gfilter; renderGraph(); return; }
  if (t.dataset.gclear) { graphSel = null; renderGraph(); return; }
  if (t.dataset.node) {
    graphSel = (graphSel === t.dataset.node) ? null : t.dataset.node;
    renderGraph();
    return;
  }

  /* 错题本 */
  if (t.dataset.review) { current = "wrong"; renderTabs(); startReview(); return; }
  if (t.dataset.rpick !== undefined) { reviewPick(+t.dataset.rpick); return; }
  if (t.dataset.rnext) { reviewNext(); return; }
  if (t.id === "resetBtn") {
    progress = { kp: {}, checks: {} };
    save(); render();
    return;
  }
});

document.addEventListener("change", e => {
  const f = e.target.closest("#rsFile");
  if (f && f.files && f.files[0]) {
    const r = new FileReader();
    r.onload = () => applyBackup(String(r.result || "").trim());
    r.readAsText(f.files[0]);
    return;
  }
  const cb = e.target.closest("[data-check]");
  if (!cb) return;
  progress.checks[cb.dataset.check] = cb.checked;
  save();
});

render();
updateCoinUI();
syncBoot();
</script>
