<meta charset="utf-8">
<title>Chloe 的 NAPLAN Year 3 练习本</title>
<style>
  :root {
    --eucalypt: #2F6B4F;
    --eucalypt-soft: #E4EFE8;
    --wattle: #C98A16;
    --wattle-soft: #FBF0D8;
    --sky: #356F8F;
    --sky-soft: #E3EDF3;
    --coral: #C2453D;
    --coral-soft: #FBE7E5;
    --plum: #6B4E8F;
    --plum-soft: #EDE7F4;
    --ink: #161C19;
    --slate: #5C6B64;
    --hairline: #DDE3DE;
    --paper: #F6F7F4;
    --card: #FFFFFF;
    --card-sunk: #F1F3EF;
    --on-accent: #FFFFFF;

    --ui: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    --read: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --data: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;

    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 22px;
    --shadow: 0 1px 2px rgba(22, 28, 25, .05), 0 6px 18px -8px rgba(22, 28, 25, .14);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --eucalypt: #74C39A;
      --eucalypt-soft: #1E2E26;
      --wattle: #E8B75A;
      --wattle-soft: #302719;
      --sky: #7FB4D2;
      --sky-soft: #1B282F;
      --coral: #E8837B;
      --coral-soft: #33201E;
      --plum: #B79BD6;
      --plum-soft: #241E30;
      --ink: #E7EDE9;
      --slate: #9BAAA2;
      --hairline: #2C3833;
      --paper: #121614;
      --card: #1A211E;
      --card-sunk: #151B18;
      --on-accent: #10201A;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -10px rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --eucalypt: #74C39A;
    --eucalypt-soft: #1E2E26;
    --wattle: #E8B75A;
    --wattle-soft: #302719;
    --sky: #7FB4D2;
    --sky-soft: #1B282F;
    --coral: #E8837B;
    --coral-soft: #33201E;
    --plum: #B79BD6;
    --plum-soft: #241E30;
    --ink: #E7EDE9;
    --slate: #9BAAA2;
    --hairline: #2C3833;
    --paper: #121614;
    --card: #1A211E;
    --card-sunk: #151B18;
    --on-accent: #10201A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -10px rgba(0, 0, 0, .6);
  }

  :root[data-theme="light"] {
    --eucalypt: #2F6B4F;
    --eucalypt-soft: #E4EFE8;
    --wattle: #C98A16;
    --wattle-soft: #FBF0D8;
    --sky: #356F8F;
    --sky-soft: #E3EDF3;
    --coral: #C2453D;
    --coral-soft: #FBE7E5;
    --plum: #6B4E8F;
    --plum-soft: #EDE7F4;
    --ink: #161C19;
    --slate: #5C6B64;
    --hairline: #DDE3DE;
    --paper: #F6F7F4;
    --card: #FFFFFF;
    --card-sunk: #F1F3EF;
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(22, 28, 25, .05), 0 6px 18px -8px rgba(22, 28, 25, .14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 18px 72px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--hairline);
  }
  .head-in {
    max-width: 940px; margin: 0 auto; padding: 14px 18px 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  .brand h1 {
    margin: 0; font-size: 1.28rem; font-weight: 700; letter-spacing: -.01em;
    text-wrap: balance;
  }
  /* 四线格：澳洲小学书写练习纸的虚线格，作为标题下的装饰 */
  .brand h1::after {
    content: ""; display: block; height: 9px; margin-top: 5px;
    background:
      linear-gradient(to bottom, transparent 0 3px, var(--hairline) 3px 4px, transparent 4px 9px),
      repeating-linear-gradient(to right, var(--wattle) 0 5px, transparent 5px 10px);
    background-size: 100% 100%, 100% 1px;
    background-position: 0 0, 0 6px;
    background-repeat: no-repeat, repeat-x;
    opacity: .8;
  }
  .brand p { margin: 6px 0 0; font-size: .8rem; color: var(--slate); }

  .head-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; padding-top: 2px; }
  .ring { display: grid; place-items: center; width: 52px; height: 52px; position: relative; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring b { font-family: var(--data); font-size: .78rem; font-variant-numeric: tabular-nums; }

  .icon-btn {
    border: 1px solid var(--hairline); background: var(--card); color: var(--slate);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: .95rem; display: grid; place-items: center; padding: 0;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--slate); }

  /* ---------- tabs ---------- */
  nav {
    max-width: 940px; margin: 0 auto; padding: 10px 18px 12px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; border: 1px solid var(--hairline); background: var(--card);
    color: var(--slate); font-family: var(--ui); font-size: .88rem; font-weight: 600;
    padding: 7px 15px; border-radius: 100px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] {
    background: var(--eucalypt); border-color: var(--eucalypt);
    color: var(--on-accent);
  }

  /* ---------- generic ---------- */
  h2 { font-size: 1.05rem; margin: 30px 0 4px; letter-spacing: -.01em; }
  h2 .en { font-weight: 500; color: var(--slate); font-size: .82rem; margin-left: 7px; }
  .lede { margin: 0 0 16px; color: var(--slate); font-size: .88rem; max-width: 62ch; }

  .eyebrow {
    font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--slate); margin: 26px 0 8px;
  }

  button, [role="button"] { font-family: var(--ui); }
  :focus-visible { outline: 2.5px solid var(--wattle); outline-offset: 2px; border-radius: 4px; }

  /* ---------- knowledge point cards ---------- */
  .kp-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
  .kp {
    text-align: left; background: var(--card); border: 1px solid var(--hairline);
    border-radius: var(--r-md); padding: 13px 15px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s, transform .12s, box-shadow .15s;
  }
  .kp:hover { border-color: var(--eucalypt); transform: translateY(-1px); box-shadow: var(--shadow); }
  .kp-name { font-weight: 650; font-size: .95rem; line-height: 1.35; }
  .kp-en { font-size: .74rem; color: var(--slate); font-weight: 500; }
  .kp-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
  .kp-count { font-family: var(--data); font-size: .72rem; color: var(--slate); font-variant-numeric: tabular-nums; }

  .pill {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 100px;
    letter-spacing: .01em; white-space: nowrap;
  }
  .pill.new  { background: var(--card-sunk); color: var(--slate); }
  .pill.mid  { background: var(--wattle-soft); color: var(--wattle); }
  .pill.done { background: var(--eucalypt-soft); color: var(--eucalypt); }
  .pill.weak { background: var(--coral-soft); color: var(--coral); }

  .bar { height: 5px; border-radius: 99px; background: var(--card-sunk); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--eucalypt); border-radius: 99px; transition: width .35s ease; }
  .bar i.w { background: var(--coral); }
  .bar i.m { background: var(--wattle); }

  /* ---------- quiz ---------- */
  .quiz-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 22px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline);
  }
  .back {
    border: 1px solid var(--hairline); background: var(--card); color: var(--slate);
    border-radius: 100px; padding: 6px 14px; font-size: .82rem; font-weight: 600; cursor: pointer;
  }
  .back:hover { color: var(--ink); border-color: var(--slate); }
  .quiz-title { font-weight: 700; font-size: 1rem; }
  .dots { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--card-sunk); border: 1px solid var(--hairline); }
  .dot.ok { background: var(--eucalypt); border-color: var(--eucalypt); }
  .dot.no { background: var(--coral); border-color: var(--coral); }
  .dot.now { box-shadow: 0 0 0 3px var(--wattle-soft); border-color: var(--wattle); }

  .passage {
    background: var(--card); border: 1px solid var(--hairline); border-left: 3px solid var(--sky);
    border-radius: var(--r-md); padding: 16px 20px; margin-bottom: 18px;
    max-height: 300px; overflow-y: auto;
    font-family: var(--read); font-size: .97rem; line-height: 1.68;
  }
  .passage h4 {
    font-family: var(--ui); font-size: .74rem; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--sky); margin: 0 0 10px;
  }
  .passage p { margin: 0 0 .8em; }
  .passage p:last-child { margin-bottom: 0; }
  .passage em { font-style: italic; }
  .passage .sub { font-style: italic; font-weight: 600; }

  .q-card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); }
  .q-meta { font-family: var(--data); font-size: .7rem; color: var(--slate); margin-bottom: 9px; }
  .q-text { font-size: 1.06rem; font-weight: 600; line-height: 1.5; margin: 0 0 16px; text-wrap: pretty; }
  .q-text.serif { font-family: var(--read); font-weight: 500; }

  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; align-items: flex-start; gap: 11px; width: 100%; text-align: left;
    background: var(--card); border: 1.5px solid var(--hairline); border-radius: var(--r-md);
    padding: 12px 14px; cursor: pointer; font-size: .97rem; color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--eucalypt); background: var(--eucalypt-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--card-sunk); color: var(--slate);
    display: grid; place-items: center; font-family: var(--data); font-size: .78rem; font-weight: 700;
  }
  .opt .body { padding-top: 1px; }
  .opt.correct { border-color: var(--eucalypt); background: var(--eucalypt-soft); }
  .opt.correct .letter { background: var(--eucalypt); color: var(--card); }
  .opt.wrong { border-color: var(--coral); background: var(--coral-soft); }
  .opt.wrong .letter { background: var(--coral); color: var(--card); }
  .opt.dim { opacity: .5; }

  .verdict {
    margin-top: 16px; padding: 14px 16px; border-radius: var(--r-md);
    background: var(--card-sunk); border-left: 3px solid var(--slate);
  }
  .verdict.good { background: var(--eucalypt-soft); border-left-color: var(--eucalypt); }
  .verdict.bad  { background: var(--coral-soft); border-left-color: var(--coral); }
  .verdict b { display: block; font-size: .92rem; margin-bottom: 4px; }
  .verdict p { margin: 0; font-size: .88rem; line-height: 1.6; }
  .verdict .src { display: block; margin-top: 8px; font-family: var(--data); font-size: .7rem; color: var(--slate); }

  .q-nav { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .btn {
    border: none; border-radius: 100px; padding: 11px 22px; font-size: .93rem; font-weight: 700;
    cursor: pointer; background: var(--eucalypt); color: var(--on-accent);
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid var(--hairline); color: var(--slate); font-weight: 600; }
  .btn.ghost:hover { color: var(--ink); border-color: var(--slate); }

  .score-card {
    text-align: center; background: var(--card); border: 1px solid var(--hairline);
    border-radius: var(--r-lg); padding: 32px 24px; box-shadow: var(--shadow);
  }
  .score-big { font-family: var(--data); font-size: 2.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .score-card p { color: var(--slate); font-size: .9rem; margin: 10px 0 20px; }
  .wrongs { text-align: left; margin: 20px auto 0; max-width: 480px; }
  .wrongs h5 { font-size: .8rem; margin: 0 0 8px; color: var(--slate); font-weight: 700; }
  .wrongs li { font-size: .86rem; margin-bottom: 6px; line-height: 1.5; }

  /* ---------- 树状框架图（自绘，字号固定不缩放） ---------- */
  .tree {
    background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-md);
    padding: 18px 20px 20px; margin-bottom: 16px;
  }
  .tree-root {
    display: inline-flex; align-items: baseline; gap: 9px;
    background: var(--acc-soft); color: var(--acc);
    border-radius: 100px; padding: 8px 19px; font-weight: 750; font-size: 1.14rem;
    margin-bottom: 6px;
  }
  .tree-root small { font-weight: 600; font-size: .82rem; opacity: .85; }

  .branches { display: grid; row-gap: 6px; column-gap: 24px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

  .branch { padding: 12px 0 4px 20px; position: relative; }
  /* 竖向连接线 */
  .branch::before {
    content: ""; position: absolute; left: 4px; top: 0; bottom: 10px;
    border-left: 2px solid var(--hairline); border-radius: 2px;
  }
  .branch-head {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; position: relative;
  }
  /* 横向连接线 + 节点圆点 */
  .branch-head::before {
    content: ""; position: absolute; left: -16px; top: .62em; width: 11px;
    border-top: 2px solid var(--hairline);
  }
  .branch-head::after {
    content: ""; position: absolute; left: -8px; top: calc(.62em - 3px);
    width: 8px; height: 8px; border-radius: 50%; background: var(--acc);
  }
  .branch-head em {
    font-style: normal; font-weight: 600; font-size: .8rem; color: var(--slate);
    background: var(--card-sunk); border-radius: 5px; padding: 2px 7px;
  }

  .leaves { list-style: none; margin: 0; padding: 0 0 0 2px; }
  .leaves li {
    position: relative; padding: 6px 0 6px 17px;
    font-size: 1.03rem; line-height: 1.45;
  }
  .leaves li::before {
    content: ""; position: absolute; left: 2px; top: .78em;
    width: 8px; border-top: 1.5px solid var(--acc); opacity: .55;
  }
  .leaves li b { font-weight: 650; }
  .leaves li span { display: block; color: var(--slate); font-size: .91rem; margin-top: 2px; line-height: 1.5; }
  .leaves li.hot b { color: var(--coral); }
  .leaves li.hot::before { border-color: var(--coral); opacity: 1; }

  /* 决策树 */
  .flow { display: flex; flex-direction: column; gap: 0; }
  .flow-q {
    background: var(--card-sunk); border-radius: var(--r-sm);
    padding: 11px 16px; font-weight: 700; font-size: 1.08rem;
  }
  .flow-yes {
    margin: 8px 0 8px 26px; padding: 12px 16px;
    border: 1.5px solid var(--acc); background: var(--acc-soft);
    border-radius: var(--r-sm); font-size: 1rem;
  }
  .flow-yes b { display: block; font-size: 1.06rem; margin-bottom: 3px; }
  .flow-yes span { color: var(--slate); font-size: .91rem; }
  .flow-tag {
    display: inline-block; font-size: .74rem; font-weight: 700; color: var(--slate);
    margin: 0 0 0 6px;
  }
  .flow-arrow { color: var(--slate); font-size: .8rem; padding-left: 6px; margin: 2px 0; }

  .map-note { color: var(--slate); font-size: .86rem; margin: 0 0 20px; }

  /* ---------- 知识图谱 ---------- */
  .g-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .g-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip {
    border: 1px solid var(--hairline); background: var(--card); color: var(--slate);
    border-radius: 100px; padding: 6px 14px; font-size: .86rem; font-weight: 650; cursor: pointer;
  }
  .fchip:hover { color: var(--ink); }
  .fchip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .g-legend { display: flex; gap: 13px; flex-wrap: wrap; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--slate); }
  .lg i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }

  .g-wrap {
    background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-md);
    overflow-x: auto; overflow-y: hidden; padding: 6px;
    /* 图谱比正文宽：在大屏上突破 940px 的正文宽度限制 */
    width: min(1160px, calc(100vw - 36px));
    margin-left: calc(min(0px, (904px - min(1160px, 100vw - 36px)) / 2));
  }
  .g-wrap svg { display: block; }
  .gnode { cursor: pointer; transition: opacity .18s; }
  .gnode:hover rect { stroke-width: 3; }
  .gnode.off { opacity: .16; }
  .gnode.sel rect { filter: drop-shadow(0 3px 8px rgba(0,0,0,.22)); }
  .gnode text { pointer-events: none; font-family: var(--ui); }
  .gnode:focus-visible rect { stroke-width: 3.5; }

  .link-btn {
    border: none; background: none; color: var(--sky); font-family: var(--ui);
    font-size: .86rem; font-weight: 650; cursor: pointer; padding: 0 0 0 8px; text-decoration: underline;
  }

  .g-detail {
    background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-md);
    padding: 18px 20px 20px; margin-bottom: 22px;
  }
  .empty-detail b { display: block; font-size: 1.02rem; margin-bottom: 6px; }
  .empty-detail p { margin: 0; color: var(--slate); font-size: .93rem; line-height: 1.65; }
  .gd-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .gd-cl {
    font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: var(--acc);
    background: var(--acc-soft); border-radius: 5px; padding: 3px 8px;
  }
  .gd-name { font-size: 1.32rem; font-weight: 750; margin-top: 7px; }
  .gd-tip { font-size: 1rem; line-height: 1.65; margin: 12px 0 18px; }
  .gd-rel { margin-bottom: 14px; }
  .gd-rel-h {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: .88rem; font-weight: 700; margin-bottom: 7px;
  }
  .gd-rel-h em { font-style: normal; font-weight: 500; color: var(--slate); font-size: .8rem; }
  .dotk { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .gd-item {
    display: block; width: 100%; text-align: left; background: var(--card-sunk);
    border: 1px solid transparent; border-radius: var(--r-sm);
    padding: 10px 13px; margin-bottom: 6px; cursor: pointer; font-family: var(--ui);
  }
  .gd-item:hover { border-color: var(--acc); background: var(--acc-soft); }
  .gd-item b { display: block; font-size: .97rem; color: var(--ink); }
  .gd-item span { display: block; color: var(--slate); font-size: .87rem; margin-top: 2px; line-height: 1.5; }

  /* ---------- 标签徽标 / 计时 ---------- */
  .badge {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    margin-left: 6px; border-radius: 99px; background: var(--coral); color: #fff;
    font-family: var(--data); font-size: .68rem; font-weight: 700; vertical-align: 1px;
  }
  .tab[aria-selected="true"] .badge { background: var(--on-accent); color: var(--eucalypt); }
  .clock {
    margin-left: auto; font-family: var(--data); font-size: 1.05rem; font-weight: 700;
    font-variant-numeric: tabular-nums; background: var(--card-sunk);
    padding: 4px 12px; border-radius: 100px;
  }
  .clock.low { background: var(--coral-soft); color: var(--coral); }

  /* ---------- 听写 ---------- */
  .dict-stage {
    display: flex; align-items: center; gap: 16px; padding: 8px 0 18px;
  }
  .play-btn {
    flex-shrink: 0; width: 72px; height: 72px; border-radius: 50%;
    border: none; background: var(--sky); color: #fff; font-size: 1.9rem;
    cursor: pointer; box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .play-btn:hover { transform: scale(1.05); }

/* ============================================================
   进度存储
   ============================================================ */
const STORE = "chloe-naplan-v1";
const BLANK = { kp: {}, checks: {}, wrong: {}, spell: {}, drill: { best: 0, runs: [] }, tests: [] };
let progress = load();
function load() {
  let p;
  try { p = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { p = {}; }
  for (const k in BLANK) if (p[k] === undefined) p[k] = JSON.parse(JSON.stringify(BLANK[k]));
  return p;
}

/* ---- 错题本：答错入册，连续答对两次自动消除 ---- */
function wrongKey(subj, kp, i) { return subj + "::" + kp + "::" + i; }
function markWrong(subj, kp, i) {
  const k = wrongKey(subj, kp, i);
  const w = progress.wrong[k] || { times: 0, streak: 0 };
  w.times++; w.streak = 0; w.at = Date.now();
  progress.wrong[k] = w; save();
}
function markRight(subj, kp, i) {
  const k = wrongKey(subj, kp, i), w = progress.wrong[k];
  if (!w) return;
  w.streak = (w.streak || 0) + 1;
  if (w.streak >= 2) delete progress.wrong[k]; else progress.wrong[k] = w;
  save();
}
function wrongList() {
  return Object.keys(progress.wrong).map(k => {
    const [subj, kp, i] = k.split("::");
    const g = BANK[subj] && BANK[subj].groups.find(x => x.kp === kp);
    if (!g || !g.qs[+i]) return null;
    return { subj, kp, i: +i, q: g.qs[+i], meta: progress.wrong[k] };
  }).filter(Boolean).sort((a, b) => b.meta.times - a.meta.times);
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
}
function kpKey(subj, kp) { return subj + "::" + kp; }
function kpStat(subj, kp) {
  return progress.kp[kpKey(subj, kp)] || { done: 0, right: 0, total: 0 };
}
function recordRun(subj, kp, right, total) {
  progress.kp[kpKey(subj, kp)] = { done: 1, right, total, at: Date.now() };
  save();
}

function earn(id) {
  if (!progress.badges) progress.badges = {};
  if (progress.badges[id]) return null;
  progress.badges[id] = Date.now(); save();
  return BADGES.find(b => b.id === id);
}

function touchStreak() {
  const today = new Date().toISOString().slice(0, 10);
  const s = progress.streak || { last: "", days: 0 };
  if (s.last === today) return s;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  s.days = (s.last === y) ? s.days + 1 : 1;
  s.last = today;
  progress.streak = s; save();
  if (s.days >= 3) earn("streak3");
  if (s.days >= 7) earn("streak7");
  return s;
}

function checkMilestones() {
  let totalQ = 0, perfect = 0;
  Object.values(progress.kp).forEach(s => {
    totalQ += s.total || 0;
    if (s.total && s.right === s.total) perfect++;
  });
  if (totalQ >= 1) earn("first");
  if (totalQ >= 100) earn("hundred");
  if (perfect >= 1) earn("perfect");
  if (perfect >= 5) earn("perfect5");
  if ((progress.cleared || 0) >= 5) earn("fixer");
  for (const id in BANK) {
    const all = BANK[id].groups.every(g => {
      const st = kpStat(id, g.kp);
      return st.total && st.right / st.total >= .85;
    });
    if (all) earn("master");
  }
}

function toast(badge) {
  if (!badge) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="t-icon">${badge.icon}</span><span><b>获得徽章：${esc(badge.n)}</b><small>${esc(badge.d)}</small></span>`;

  setTimeout(() => { el.classList.remove("in"); setTimeout(() => el.remove(), 400); }, 3200);
}

function startQuiz(subj, kpName) {

function renderQuiz() {
  const { group, i, results } = quiz;
  const q = group.qs[i];
  const isReading = quiz.subj === "reading";

  const dots = group.qs.map((_, n) => {

      <div class="opts" id="opts">
        ${q.o.map((o, n) => `<button class="opt" data-pick="${n}">
          <span class="letter">${"ABCD"[n]}</span><span class="body">${o}</span>
        </button>`).join("")}
      </div>
      <div id="verdict"></div>
      <div class="q-nav" id="qnav"></div>
    </div>`;
}

function pick(n) {
  if (quiz.answered) return;
  quiz.answered = true;
  const q = quiz.group.qs[quiz.i];
  const ok = n === q.a;
  quiz.results[quiz.i] = ok;
  if (ok) markRight(quiz.subj, quiz.kp, quiz.i); else markWrong(quiz.subj, quiz.kp, quiz.i);

  document.querySelectorAll("#opts .opt").forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.a) b.classList.add("correct");
    else if (idx === n) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  document.getElementById("verdict").innerHTML = `
    <div class="verdict ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ " + cheer() : "✗ 正确答案是 " + "ABCD"[q.a]}</b>
      <p>${q.e}</p>
      <span class="src">出处：${esc(q.s)}</span>
    </div>`;

  const last = quiz.i === quiz.group.qs.length - 1;
  document.getElementById("qnav").innerHTML =
    `<button class="btn" data-next="1">${last ? "看成绩" : "下一题 →"}</button>`;

  document.querySelectorAll(".dot")[quiz.i].className = "dot " + (ok ? "ok" : "no") + " now";
}

function next() {
  if (quiz.i === quiz.group.qs.length - 1) return finish();
  quiz.i++;
  quiz.answered = false;
  renderQuiz();
}

function finish() {
  const total = quiz.group.qs.length;
  const right = quiz.results.filter(Boolean).length;
  recordRun(quiz.subj, quiz.kp, right, total);
  touchStreak();
  checkMilestones();
  renderTabs();
  if (right === total) toast(earn("perfect"));
  const pct = Math.round(right / total * 100);
  const wrongIdx = quiz.results.map((r, n) => r ? -1 : n).filter(n => n >= 0);

  const msg = pct === 100 ? "全对！这个知识点可以打勾了 🎉"
    : pct >= 85 ? "很好，基本掌握了。错的那题看一遍讲解就行。"
    : pct >= 60 ? "有进步空间 —— 把错题的讲解读一遍，明天再做一次这一组。"
    : "这个知识点先回《知识点.md》重新学一遍，两天后再来做。不着急。";

  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-back="${quiz.subj}">← ${BANK[quiz.subj].label}</button>
      <span class="quiz-title">${esc(quiz.kp)} · 成绩</span>
    </div>

      </div>` : ""}

}

/* ============================================================
   专项训练 1：拼写听写（浏览器语音，模拟真实考试的音频题）
   ============================================================ */
let voices = [];
function pickVoice() {
  if (!window.speechSynthesis) return null;
  if (!voices.length) voices = speechSynthesis.getVoices() || [];
  return voices.find(v => v.lang === "en-AU") || voices.find(v => v.lang === "en-GB")
      || voices.find(v => /^en/.test(v.lang)) || voices[0] || null;
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices() || []; };
  voices = speechSynthesis.getVoices() || [];
}
function say(parts) {
  if (!window.speechSynthesis) return false;
  speechSynthesis.cancel();
  const v = pickVoice();
  parts.forEach(txt => {
    const u = new SpeechSynthesisUtterance(txt);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-AU";
    u.rate = .8; u.pitch = 1;
    speechSynthesis.speak(u);
  });
  return true;
}

let dict = null;
function startDict(lv) {
  const set = SPELL[lv];
  const words = set.w.slice().sort(() => Math.random() - .5).slice(0, 10);
  dict = { lv, set, words, i: 0, results: [], revealed: false };
  renderDict();
}

function renderDict() {
  if (!dict) return renderTrain();
  const { words, i, results } = dict;
  const w = words[i];
  const dots = words.map((_, n) => {
    const r = results[n];
    return `<span class="dot ${r === undefined ? "" : r ? "ok" : "no"} ${n === i ? "now" : ""}"></span>`;
  }).join("");

  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-tab2="train">← 专项训练</button>
      <span class="quiz-title">听写 · ${esc(dict.set.lv)}</span>
      <span class="dots">${dots}</span>
    </div>
    <div class="panel" style="border-left:3px solid var(--wattle)">
      <p class="sub" style="margin:0"><strong>老师说 ·</strong> 真实考试是「读单词 → 读例句 → 再读一次单词」，然后你输入拼写。听不清可以重放，考试时也允许重听。</p>
    </div>
    <div class="q-card">
      <div class="q-meta">第 ${i + 1} / ${words.length} 个词</div>
      <div class="dict-stage">
        <button class="play-btn" data-play="1" aria-label="播放这个单词">🔊</button>
        <div class="dict-hint">
          <b>点喇叭听写</b>
          <span>听完在下面输入你听到的单词</span>
        </div>
      </div>
      <input class="dict-input" id="dictIn" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="在这里输入…" aria-label="输入你听到的单词">
      <div id="dictVerdict"></div>
      <div class="q-nav" id="dictNav">
        <button class="btn" data-dcheck="1">检查</button>
        <button class="btn ghost" data-dreveal="1">家长看词</button>
      </div>
    </div>`;
  const inp = document.getElementById("dictIn");
  inp.focus();
  inp.addEventListener("keydown", e => { if (e.key === "Enter") checkDict(); });
  playDict();
}

function playDict() {
  const w = dict.words[dict.i];
  const ok = say([w[0], w[1], w[0]]);
  if (!ok) {
    const v = document.getElementById("dictVerdict");
    if (v && !dict.revealed) v.innerHTML = `<div class="verdict"><b>这台设备不支持语音朗读</b>
      <p>请家长点「家长看词」，把单词和例句念给孩子听 —— 这样其实更接近真实考场。</p></div>`;
  }
}

function checkDict() {
  if (dict.answered) return;
  const inp = document.getElementById("dictIn");
  const val = (inp.value || "").trim();
  if (!val) { inp.focus(); return; }
  const w = dict.words[dict.i];
  const ok = val.toLowerCase() === w[0].toLowerCase();
  dict.answered = true;
  dict.results[dict.i] = ok;
  if (!ok) {
    progress.spell[w[0]] = (progress.spell[w[0]] || 0) + 1;
    save();
  }
  inp.disabled = true;
  inp.classList.add(ok ? "good" : "bad");

  document.getElementById("dictVerdict").innerHTML = `
    <div class="verdict ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ " + cheer() : "✗ 正确拼写是 " + w[0]}</b>
      <p><em>${esc(w[1])}</em></p>
      ${ok ? "" : `<span class="src">这个词已记入错词表，下一轮会再考一次</span>`}
    </div>`;

  const last = dict.i === dict.words.length - 1;
  document.getElementById("dictNav").innerHTML =
    `<button class="btn" data-dnext="1">${last ? "看成绩" : "下一个 →"}</button>`;
  document.querySelectorAll(".dot")[dict.i].className = "dot " + (ok ? "ok" : "no") + " now";
}

function nextDict() {
  if (dict.i === dict.words.length - 1) return finishDict();
  dict.i++; dict.answered = false; dict.revealed = false;
  renderDict();
}

function finishDict() {
  const total = dict.words.length, right = dict.results.filter(Boolean).length;
  touchStreak();
  if (right === total) toast(earn("speller"));
  const wrongs = dict.words.filter((_, n) => !dict.results[n]);
  view.innerHTML = `
    <div class="quiz-head">

      <p>${right === total ? "全对！这一级可以往下走了 🐝"
        : right >= total - 2 ? "很不错，把错的两个词用五步法再练一遍。"
        : "错得有点多 —— 今天先别加新词，把这 10 个用 Look-Say-Cover-Write-Check 过一遍。"}</p>
      <div class="q-nav" style="justify-content:center">
        <button class="btn" data-dict="${dict.lv}">再来一轮</button>
        <button class="btn ghost" data-tab2="train">回到专项训练</button>
      </div>
      ${wrongs.length ? `<div class="wrongs">
        <h5>要重练的词（${wrongs.length}）</h5>
        <ul>${wrongs.map(w => `<li><b>${esc(w[0])}</b> — <span style="color:var(--slate)">${esc(w[1])}</span></li>`).join("")}</ul>
      </div>` : ""}
    </div>`;
  dict = null;
}

/* ============================================================
   专项训练 2：乘法口诀抢答（3 分钟限时）
   ============================================================ */
let drill = null;
function startDrill(tables) {
  drill = { tables, i: 0, right: 0, wrong: [], input: "", start: Date.now(), left: 180, q: null, tId: null };
  nextFact();
  drill.tId = setInterval(() => {
    drill.left--;
    const el = document.getElementById("drillClock");
    if (el) {
      el.textContent = fmtTime(drill.left);
      if (drill.left <= 30) el.classList.add("low");
    }
    if (drill.left <= 0) finishDrill();
  }, 1000);
  renderDrill();
}
function fmtTime(s) { const m = Math.floor(s / 60); return m + ":" + String(s % 60).padStart(2, "0"); }
function nextFact() {
  const t = drill.tables[Math.floor(Math.random() * drill.tables.length)];
  const n = 1 + Math.floor(Math.random() * 12);
  drill.q = { a: t, b: n, ans: t * n };
  drill.input = "";
  drill.qStart = Date.now();
}

function renderDrill() {
  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-quitdrill="1">← 结束</button>
      <span class="quiz-title">口诀抢答</span>
      <span class="clock" id="drillClock">${fmtTime(drill.left)}</span>
    </div>
    <div class="drill-card">
      <div class="drill-score"><b id="drillRight">${drill.right}</b> 题答对</div>
      <div class="drill-q" id="drillQ">${drill.q.a} × ${drill.q.b} =</div>
      <div class="drill-in" id="drillIn">${drill.input || "?"}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-key="${n}">${n}</button>`).join("")}
        <button class="key sm" data-key="clr">清除</button>
        <button class="key" data-key="0">0</button>
        <button class="key go" data-key="ok">✓</button>
      </div>
    </div>
    <p class="map-note" style="margin-top:14px">目标：3 分钟答对 25 题以上。答对自动跳下一题，不用按确定。</p>`;
}

function drillKey(k) {
  if (!drill) return;
  if (k === "clr") { drill.input = ""; }
  else if (k === "ok") { return drillSubmit(); }
  else if (drill.input.length < 3) { drill.input += k; }
  document.getElementById("drillIn").textContent = drill.input || "?";
  if (drill.input && +drill.input === drill.q.ans) drillSubmit();
}

function drillSubmit() {
  if (!drill.input) return;
  const ok = +drill.input === drill.q.ans;
  const el = document.getElementById("drillIn");
  if (ok) {
    drill.right++;
    document.getElementById("drillRight").textContent = drill.right;
    el.classList.add("hit");
    setTimeout(() => {
      if (!drill) return;
      el.classList.remove("hit");
      nextFact();
      document.getElementById("drillQ").textContent = drill.q.a + " × " + drill.q.b + " =";
      document.getElementById("drillIn").textContent = "?";
    }, 180);
  } else {
    drill.wrong.push(drill.q.a + " × " + drill.q.b + " = " + drill.q.ans);
    el.classList.add("miss");
    setTimeout(() => {
      if (!drill) return;
      el.classList.remove("miss");
      drill.input = "";
      document.getElementById("drillIn").textContent = "?";
    }, 450);
  }
}

function finishDrill() {
  if (!drill) return;
  clearInterval(drill.tId);
  const right = drill.right, wrong = drill.wrong.slice(0, 12);
  const best = Math.max(progress.drill.best || 0, right);
  const isBest = right > (progress.drill.best || 0);
  progress.drill.best = best;
  progress.drill.runs = (progress.drill.runs || []).concat([{ right, at: Date.now() }]).slice(-20);
  save(); touchStreak();
  if (right >= 25) toast(earn("times"));

  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-tab2="train">← 专项训练</button>
      <span class="quiz-title">口诀抢答 · 成绩</span>
    </div>
    <div class="score-card">
      <div class="score-big">${right}<span style="font-size:1.4rem;color:var(--slate)"> 题</span></div>
      <p>${isBest ? "🎉 新纪录！之前最好成绩是 " + (progress.drill.runs.length > 1 ? Math.max(...progress.drill.runs.slice(0, -1).map(r => r.right)) : 0) + " 题"
        : "个人最好成绩：" + best + " 题"}<br>
        ${right >= 25 ? "口诀已经很熟了 ⚡ 保持每天 3 分钟就行。"
        : right >= 15 ? "不错。哪一组慢就单独练那一组。"
        : "先只练 ×2 和 ×10，熟了再加 ×5 和 ×3。"}</p>
      <div class="q-nav" style="justify-content:center">
        <button class="btn" data-drill="${drill.tables.join(",")}">再来一次</button>
        <button class="btn ghost" data-tab2="train">回到专项训练</button>
      </div>
      ${wrong.length ? `<div class="wrongs">
        <h5>答错的口诀</h5>
        <ul>${wrong.map(w => `<li class="num" style="font-family:var(--data)">${esc(w)}</li>`).join("")}</ul>
      </div>` : ""}
    </div>`;
  drill = null;
}

/* ============================================================
   专项训练 3：限时测验（模拟考试节奏，中途不给答案）
   ============================================================ */
let exam = null;
function startExam(subj, n, mins) {
  const pool = [];
  BANK[subj].groups.forEach(g => g.qs.forEach((q, i) => pool.push({ kp: g.kp, i, q })));
  pool.sort(() => Math.random() - .5);
  exam = { subj, qs: pool.slice(0, Math.min(n, pool.length)), i: 0, picks: [], left: mins * 60, total0: mins * 60, tId: null };
  exam.tId = setInterval(() => {
    exam.left--;
    const el = document.getElementById("examClock");
    if (el) { el.textContent = fmtTime(exam.left); if (exam.left <= 60) el.classList.add("low"); }
    if (exam.left <= 0) finishExam();
  }, 1000);
  renderExam();
}

function renderExam() {
  const { qs, i, picks } = exam;
  const item = qs[i];
  const q = item.q;
  const isReading = exam.subj === "reading";
  const txt = isReading && q.t ? READING_TEXTS[q.t] : null;
  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-quitexam="1">← 结束</button>
      <span class="quiz-title">限时测验 · ${BANK[exam.subj].label}</span>
      <span class="clock" id="examClock">${fmtTime(exam.left)}</span>
    </div>
    ${txt ? `<div class="passage"><h4>${esc(txt.type)} — ${esc(txt.title)}</h4>${txt.html}</div>` : ""}
    <div class="q-card">
      <div class="q-meta">第 ${i + 1} / ${qs.length} 题 · 中途不显示对错，交卷后一次看</div>
      <p class="q-text ${isReading ? "serif" : ""}">${q.q}</p>
      <div class="opts">
        ${q.o.map((o, n) => `<button class="opt ${picks[i] === n ? "chosen" : ""}" data-epick="${n}">
          <span class="letter">${"ABCD"[n]}</span><span class="body">${o}</span>
        </button>`).join("")}
      </div>
      <div class="q-nav">
        <button class="btn ghost" data-emove="-1" ${i === 0 ? "disabled" : ""}>← 上一题</button>
        ${i === qs.length - 1
          ? `<button class="btn" data-esubmit="1">交卷</button>`
          : `<button class="btn" data-emove="1">下一题 →</button>`}
        <span class="kp-count" style="margin-left:auto">已答 ${picks.filter(x => x !== undefined).length}/${qs.length}</span>
      </div>
    </div>`;
}

function finishExam() {
  if (!exam) return;
  clearInterval(exam.tId);
  const byKp = {};
  let right = 0;
  exam.qs.forEach((item, n) => {
    const ok = exam.picks[n] === item.q.a;
    if (ok) right++;
    byKp[item.kp] = byKp[item.kp] || { r: 0, t: 0 };
    byKp[item.kp].t++; if (ok) byKp[item.kp].r++;
    if (ok) markRight(exam.subj, item.kp, item.i);
    else markWrong(exam.subj, item.kp, item.i);
  });
  const total = exam.qs.length, pct = Math.round(right / total * 100);
  const used = Math.max(0, (exam.total0 || 0) - Math.max(0, exam.left));
  const timedOut = exam.left <= 0;
  progress.tests = (progress.tests || []).concat([{ subj: exam.subj, right, total, at: Date.now() }]).slice(-20);
  save(); touchStreak(); checkMilestones(); renderTabs();

  const rows = Object.entries(byKp).sort((a, b) => (a[1].r / a[1].t) - (b[1].r / b[1].t))
    .map(([kp, s]) => {
      const p = Math.round(s.r / s.t * 100);
      return `<tr><td>${esc(kp)}</td><td class="num">${s.r}/${s.t}</td>
        <td><span class="pill ${p >= 85 ? "done" : p >= 60 ? "mid" : "weak"}">${p}%</span></td></tr>`;
    }).join("");

  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-tab2="train">← 专项训练</button>
      <span class="quiz-title">限时测验 · 成绩</span>
    </div>
    <div class="score-card">
      <div class="score-big">${right}<span style="font-size:1.4rem;color:var(--slate)">/${total}</span></div>
      <p>正确率 ${pct}% ${timedOut ? "· ⏰ 时间到" : "· 用时 " + fmtTime(used)}<br>
      ${pct >= 85 ? "这一科状态很好。" : pct >= 70 ? "接近 Strong 水平，把下面正确率低的知识点补一补。" : "别急 —— 按下面的表，从最低的那一行开始补。"}</p>
      <div class="q-nav" style="justify-content:center">
        <button class="btn" data-tab2="wrong">去错题本（已自动收录错题）</button>
        <button class="btn ghost" data-tab2="train">再测一次</button>
      </div>
    </div>
    <p class="eyebrow">分知识点表现（从最弱排起）</p>
    <div class="panel scroll-x">
      <table><thead><tr><th>知识点</th><th class="num">得分</th><th>正确率</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  exam = null;
}

let review = null;
function startReview() {
  const list = wrongList();
  if (!list.length) return renderWrong();
  review = { list: list.slice(0, 15), i: 0, results: [], answered: false };
  renderReview();
}

function renderReview() {
  const { list, i, results } = review;
  const item = list[i];
  const q = item.q;
  const isReading = item.subj === "reading";
  const txt = isReading && q.t ? READING_TEXTS[q.t] : null;
  const dots = list.map((_, n) => {
    const r = results[n];
    return `<span class="dot ${r === undefined ? "" : r ? "ok" : "no"} ${n === i ? "now" : ""}"></span>`;
  }).join("");
  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-tab2="wrong">← 错题本</button>
      <span class="quiz-title">重做错题</span>
      <span class="dots">${dots}</span>
    </div>
    <div class="panel" style="border-left:3px solid var(--coral)">
      <p class="sub" style="margin:0"><strong>规则 ·</strong> 一道题<strong>连续答对两次</strong>才会从错题本消失。这道题你之前错过 ${item.meta.times} 次${item.meta.streak ? `，已连对 ${item.meta.streak} 次` : ""}。</p>
    </div>
    ${txt ? `<div class="passage"><h4>${esc(txt.type)} — ${esc(txt.title)}</h4>${txt.html}</div>` : ""}
    <div class="q-card">
      <div class="q-meta">第 ${i + 1} / ${list.length} 题 · ${esc(BANK[item.subj].label)} → ${esc(item.kp)}</div>
      <p class="q-text ${isReading ? "serif" : ""}">${q.q}</p>
      <div class="opts" id="opts">
        ${q.o.map((o, n) => `<button class="opt" data-rpick="${n}">
          <span class="letter">${"ABCD"[n]}</span><span class="body">${o}</span>
        </button>`).join("")}
      </div>
      <div id="verdict"></div>
      <div class="q-nav" id="qnav"></div>
    </div>`;
}

function reviewPick(n) {
  if (review.answered) return;
  review.answered = true;
  const item = review.list[review.i], q = item.q, ok = n === q.a;
  review.results[review.i] = ok;
  if (ok) {
    const before = progress.wrong[wrongKey(item.subj, item.kp, item.i)];
    const wasStreak = before ? before.streak || 0 : 0;
    markRight(item.subj, item.kp, item.i);
    if (wasStreak + 1 >= 2) progress.cleared = (progress.cleared || 0) + 1;
    save();
  } else markWrong(item.subj, item.kp, item.i);
  renderTabs();

  document.querySelectorAll("#opts .opt").forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.a) b.classList.add("correct");
    else if (idx === n) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const cleared = ok && (progress.wrong[wrongKey(item.subj, item.kp, item.i)] === undefined);
  document.getElementById("verdict").innerHTML = `
    <div class="verdict ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ " + cheer() : "✗ 正确答案是 " + "ABCD"[q.a]}</b>
      <p>${q.e}</p>
      <span class="src">${cleared ? "🎉 连对两次，这道题从错题本移除了" : ok ? "再答对一次就能移出错题本" : "别急，讲解再读一遍，下次一定行"} · ${esc(q.s)}</span>
    </div>`;
  const last = review.i === review.list.length - 1;
  document.getElementById("qnav").innerHTML =
    `<button class="btn" data-rnext="1">${last ? "完成" : "下一题 →"}</button>`;
  document.querySelectorAll(".dot")[review.i].className = "dot " + (ok ? "ok" : "no") + " now";
}

function reviewNext() {
  if (review.i === review.list.length - 1) {
    touchStreak(); checkMilestones();
    if ((progress.cleared || 0) >= 5) toast(earn("fixer"));
    review = null;
    return renderWrong();
  }
  review.i++; review.answered = false; renderReview();
}

function renderWrong() {
  const list = wrongList();
  const bySubj = {};
  list.forEach(w => { (bySubj[w.subj] = bySubj[w.subj] || []).push(w); });

  view.innerHTML = `

    ${list.length ? `
      <div class="stat-row">

        <div class="stat"><div class="k">已清除</div><div class="v">${progress.cleared || 0}<small> 题</small></div></div>
        <div class="stat"><div class="k">错词</div><div class="v">${spellWrong.length}<small> 个</small></div></div>
      </div>
      <div class="q-nav" style="margin:0 0 22px">
        <button class="btn" data-review="1">开始重做（最多 15 题）</button>
      </div>
      ${Object.entries(bySubj).map(([subj, ws]) => `

        <div class="panel" style="padding:6px 16px">

            <span class="pill ${w.meta.streak ? "mid" : "weak"}">${w.meta.streak ? "已连对 " + w.meta.streak + " 次" : "错 " + w.meta.times + " 次"}</span>
          </div>`).join("")}
        </div>`).join("")}
    ` : `<div class="panel"><p class="sub" style="margin:0">错题本是空的。去练习或做限时测验，做错的题会自动收进来。</p></div>`}

    ${spellWrong.length ? `

        <p class="sub" style="margin:12px 0 0">用五步法练：看 → 读 → 盖住 → 写 → 对答案。每个词 20 秒。</p>

}

const EDGE_KIND = {
  pre:  { n: "前置", d: "先会 A 才学得动 B", col: "var(--slate)",  dash: "" },
  same: { n: "跨科同源", d: "不同科目里其实是同一个概念", col: "var(--wattle)", dash: "7 5" },
  mix:  { n: "易混", d: "容易搞混，必须放一起对照记", col: "var(--coral)", dash: "2 5" },
  use:  { n: "用到", d: "B 要用到 A", col: "var(--sky)", dash: "" }
};

const NODE_BY_ID = {};
NODES.forEach(nd => {
  const [id, cl, name, col, row, tip, kp] = nd;
  const C = CLUSTERS[cl];
  NODE_BY_ID[id] = { id, cl, name, tip, kp, x: C.ox + col * COL_W + 82, y: C.oy + row * ROW_H };
});

let graphSel = null, graphFilter = "all";

function neighbours(id) {
  return EDGES.filter(e => e[0] === id || e[1] === id)
    .map(e => ({ other: e[0] === id ? e[1] : e[0], type: e[2], why: e[3], from: e[0] === id }));
}

function graphSvg() {
  const W = 1132, H = 726;
  const shown = EDGES.filter(e => graphFilter === "all" || e[2] === graphFilter);
  const active = graphSel ? new Set([graphSel, ...neighbours(graphSel).map(n => n.other)]) : null;

  const edges = shown.map(e => {
    const a = NODE_BY_ID[e[0]], b = NODE_BY_ID[e[1]], k = EDGE_KIND[e[2]];
    const on = !active || (active.has(e[0]) && active.has(e[1]));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const far = Math.abs(a.x - b.x) > 260 || Math.abs(a.y - b.y) > 200;
    const d = far
      ? `M${a.x} ${a.y} Q ${mx + (b.y - a.y) * .14} ${my - (b.x - a.x) * .14} ${b.x} ${b.y}`
      : `M${a.x} ${a.y} L${b.x} ${b.y}`;
    return `<path d="${d}" fill="none" stroke="${k.col}" stroke-width="${on ? (e[2] === "same" ? 2.6 : 2) : 1.2}"
      stroke-dasharray="${k.dash}" opacity="${on ? (active ? .95 : .5) : .07}"
      ${e[2] === "pre" || e[2] === "use" ? 'marker-end="url(#ar-' + e[2] + ')"' : ""}></path>`;
  }).join("");

  const nodes = NODES.map(nd => {
    const n = NODE_BY_ID[nd[0]], C = CLUSTERS[n.cl];
    const on = !active || active.has(n.id);
    const sel = graphSel === n.id;
    const w = Math.max(76, n.name.replace(/[^\x00-\xff]/g, "aa").length * 7.4 + 22);
    return `<g class="gnode ${on ? "" : "off"} ${sel ? "sel" : ""}" data-node="${n.id}" tabindex="0" role="button"
        aria-label="${esc(n.name)}" transform="translate(${n.x} ${n.y})">
      <rect x="${-w / 2}" y="-17" width="${w}" height="34" rx="17"
        fill="var(--${C.c}-soft)" stroke="var(--${C.c})" stroke-width="${sel ? 3 : 1.5}"></rect>
      <text y="5" text-anchor="middle" fill="var(--${C.c})" font-size="14.5" font-weight="650">${esc(n.name)}</text>
    </g>`;
  }).join("");

  const labels = Object.entries(CLUSTERS).map(([k, C]) =>
    `<text x="${C.ox + 10}" y="${C.oy - 34}" fill="var(--${C.c})" font-size="19" font-weight="750"
      opacity=".85">${esc(C.label)}</text>`).join("");

  const arrows = ["pre", "use"].map(t =>
    `<marker id="ar-${t}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="${EDGE_KIND[t].col}"></path></marker>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="NAPLAN Year 3 知识图谱"><defs>${arrows}</defs>
    ${labels}${edges}${nodes}</svg>`;
}

function graphDetail() {
  if (!graphSel) {
    return `<div class="g-detail empty-detail">
      <b>点任意一个概念看它的关联</b>
      <p>这张图的价值不在「有哪些知识点」，而在<strong>知识点之间的关系</strong>：
      哪些要先学、哪些在不同科目里其实是同一个东西、哪些最容易搞混。
      按关系记比按清单背牢得多。</p></div>`;
  }
  const n = NODE_BY_ID[graphSel];
  const ns = neighbours(graphSel);
  const byType = {};
  ns.forEach(x => (byType[x.type] = byType[x.type] || []).push(x));
  return `<div class="g-detail" style="--acc:var(--${CLUSTERS[n.cl].c});--acc-soft:var(--${CLUSTERS[n.cl].c}-soft)">
    <div class="gd-head">
      <div>
        <span class="gd-cl">${esc(CLUSTERS[n.cl].label)}</span>
        <div class="gd-name">${esc(n.name)}</div>
      </div>
      ${n.kp ? `<button class="btn" data-quiz="${n.kp[0]}" data-kp="${esc(n.kp[1])}">去练这个知识点 →</button>` : ""}
    </div>
    <p class="gd-tip">${esc(n.tip)}</p>
    ${Object.entries(byType).map(([t, list]) => `
      <div class="gd-rel">
        <div class="gd-rel-h"><span class="dotk" style="background:${EDGE_KIND[t].col}"></span>
          ${EDGE_KIND[t].n}<em>${EDGE_KIND[t].d}</em></div>
        ${list.map(x => `<button class="gd-item" data-node="${x.other}">
          <b>${t === "pre" && x.from ? "→ " : t === "pre" ? "← " : ""}${esc(NODE_BY_ID[x.other].name)}</b>
          <span>${esc(x.why)}</span></button>`).join("")}
      </div>`).join("")}
  </div>`;
}

function renderGraph() {
  const kinds = [["all", "全部关系"], ["pre", "前置链"], ["same", "跨科同源"], ["mix", "易混对照"], ["use", "用到"]];
  view.innerHTML = `
    <h2>知识图谱<span class="en">Knowledge graph</span></h2>
    <p class="lede">52 个概念、${EDGES.length} 条关系。<strong>点任意一个概念</strong>，图上只亮起和它有关系的部分，下面给出每条关系的解释。
    按关系记忆，比按清单背诵牢得多。</p>

    <div class="g-bar">
      <div class="g-filters">
        ${kinds.map(([k, l]) => `<button class="fchip ${graphFilter === k ? "on" : ""}" data-gfilter="${k}">${l}</button>`).join("")}
      </div>
      <div class="g-legend">
        ${Object.entries(EDGE_KIND).map(([k, v]) =>
          `<span class="lg"><i style="background:${v.col};${v.dash ? "opacity:.7" : ""}"></i>${v.n}</span>`).join("")}
      </div>
    </div>

    <div class="g-wrap" id="gWrap">${graphSvg()}</div>
    <p class="map-note">图较宽，手机上可左右拖动查看。${graphSel ? `<button class="link-btn" data-gclear="1">清除选中</button>` : ""}</p>

    ${graphDetail()}

    <p class="eyebrow">最值得记的 5 条跨科关系</p>
    <div class="panel">
      <ol class="m-steps">
        <li><b>不规则过去式 → 写记叙文</b><span>故事全用过去式。went/saw/came 背不熟，作文里就会写成 goed/seed。这是语言规范和写作的同一块地基。</span></li>
        <li><b>阅读的五种文体 = 写作的两种体裁</b><span>阅读课上拆解 Narrative 怎么写开头结尾，正是自己写故事时要用的结构。读和写是一件事。</span></li>
        <li><b>连接词出现在三个科目</b><span>阅读考「However 表示什么」，写作要用 Firstly/Finally，语法考 because/but/or —— 同一批词，三处得分。</span></li>
        <li><b>数学信号词 = 阅读圈关键词</b><span>altogether / each / left 和阅读题里的 NOT / MOST 一样，都是「先圈出来再答题」的同一个习惯。</span></li>
        <li><b>写作的标点拼写分 = 语言规范题</b><span>写作 10 项里标点占 5 分、拼写占 6 分。练语言规范题，等于同时在给作文提分。</span></li>
      </ol>
    </div>`;

  const wrap = document.getElementById("gWrap");
  if (wrap) {
    const svg = wrap.querySelector("svg");
    if (graphSel && svg) {
      const scale = (svg.getBoundingClientRect().width || 1132) / 1132;
      wrap.scrollLeft = NODE_BY_ID[graphSel].x * scale - wrap.clientWidth / 2;
    } else if (svg) wrap.scrollLeft = 0;
  }
}

  { q: "有人物和情节吗？", yes: ["Narrative 故事", "考：人物感受 · 事件顺序 · 故事主题"] },
  { q: "有材料清单和编号步骤吗？", yes: ["Procedure 步骤文", "考：第几步做什么 · 某步骤为何重要"] },
  { q: "分行分节、可能押韵吗？", yes: ["Poetry 诗歌", "考：押韵词 · 比喻 · 描写的画面"] },
  { q: "作者有明确的观点吗？", yes: ["Persuasive 议论文", "考：观点是什么 · 用了什么理由 · 事实还是观点"] }
];

const HOT_SPOTS = [
  ["象形图不看图例", "数学 → 图表与数据"],
  ["多步应用题只算一步", "数学 → 多步应用题"],
  ["带 0 的借位减法（604−287）", "数学 → 加减法"],
  ["its / it's 混淆、复数误加撇号", "语言规范 → 撇号"],
  ["推断题只找字面意思", "阅读 → 推断"],
  ["单位没统一就计算", "数学 → 长度质量容量"]
];

function renderMap() {
  const flow = TEXT_FLOW.map((f, i) => `
    <div class="flow-q">${i + 1}. ${esc(f.q)}</div>
    <div class="flow-yes"><b>是 → ${esc(f.yes[0])}</b><span>${esc(f.yes[1])}</span></div>
    ${i < TEXT_FLOW.length - 1 ? `<div class="flow-arrow">否 ↓ 继续问下一个</div>` : ""}`).join("");

  view.innerHTML = `
    <h2>知识框架<span class="en">Knowledge map</span></h2>
    <p class="lede">四科知识点全貌。<strong style="color:var(--coral)">红色</strong>标出的是最容易失分的地方 —— 这些要重点练。学完一块，就在纸质资料《知识框架图.md》的打勾表上打一个勾。</p>

    ${MAPS.map(m => `
      <p class="eyebrow">${esc(m.title)}</p>
      <div class="tree" style="--acc:var(--${m.acc});--acc-soft:var(--${m.acc}-soft)">
        <div class="tree-root">${esc(m.root)}<small>${esc(m.sub)}</small></div>
        <div class="branches">
          ${m.branches.map(b => `
            <div class="branch">
              <div class="branch-head">${esc(b.h)}${b.m ? `<em>${esc(b.m)}</em>` : ""}</div>
              <ul class="leaves">
                ${b.l.map(x => `<li class="${x[2] ? "hot" : ""}"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></li>`).join("")}
              </ul>
            </div>`).join("")}
        </div>
      </div>`).join("")}

    <p class="eyebrow">阅读：一篇文章是什么文体？照这个顺序问</p>
    <div class="tree" style="--acc:var(--sky);--acc-soft:var(--sky-soft)">
      <div class="flow">${flow}</div>
      <div class="flow-arrow" style="padding-left:0;margin-top:10px">四个都答「否」 ↓</div>
      <div class="flow-yes"><b>Information Report 说明文</b><span>考：找具体事实 · 小标题作用 · 图表信息</span></div>
    </div>

    <p class="eyebrow">高频失分点 TOP 6</p>
    <div class="panel scroll-x">
      <table>
        <thead><tr><th class="num">#</th><th>失分点</th><th>去哪练</th></tr></thead>
        <tbody>${HOT_SPOTS.map((h, i) =>
          `<tr><td class="num">${i + 1}</td><td>${esc(h[0])}</td><td>${esc(h[1])}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

/* ---------- router ---------- */
function render() {
  renderTabs();
  updateRing();
  if (current === "graph") renderGraph();
  else if (current === "map") renderMap();
  else if (current === "writing") renderWriting();
  else if (current === "train") renderTrain();
  else if (current === "wrong") renderWrong();
  else if (current === "coach") renderCoach();
  else if (current === "progress") renderProgress();
  else renderSubject(current);
  window.scrollTo({ top: 0 });
}

function updateRing() {
  let r = 0, t = 0;
  Object.values(progress.kp).forEach(s => { r += s.right || 0; t += s.total || 0; });
  const pct = t ? Math.round(r / t * 100) : 0;
  const arc = document.getElementById("ringArc");
  arc.setAttribute("stroke-dashoffset", String(113 - 113 * pct / 100));
  document.getElementById("ringPct").textContent = pct + "%";
}

function leave() {
  if (drill) { clearInterval(drill.tId); drill = null; }
  if (exam) { clearInterval(exam.tId); exam = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  dict = null; review = null;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-tab2],[data-quiz],[data-back],[data-pick],[data-next],[data-retry],[data-prompt],[data-dict],[data-play],[data-dcheck],[data-dreveal],[data-dnext],[data-drill],[data-key],[data-quitdrill],[data-exam],[data-epick],[data-emove],[data-esubmit],[data-quitexam],[data-review],[data-rpick],[data-rnext],[data-node],[data-gfilter],[data-gclear],#resetBtn,#themeBtn");
  if (!t) return;

  if (t.id === "themeBtn") {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark" ||
      (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", isDark ? "light" : "dark");
    return;
  }
  if (t.dataset.tab) { leave(); current = t.dataset.tab; render(); return; }
  if (t.dataset.tab2) { leave(); current = t.dataset.tab2; render(); return; }
  if (t.dataset.quiz) {
    leave();
    current = t.dataset.quiz;
    renderTabs();
    startQuiz(t.dataset.quiz, t.dataset.kp);
    window.scrollTo({ top: 0 });
    return;
  }
  if (t.dataset.back) { leave(); current = t.dataset.back; render(); return; }
  if (t.dataset.pick !== undefined) { pick(+t.dataset.pick); return; }
  if (t.dataset.next) { next(); return; }
  if (t.dataset.retry) { startQuiz(quiz.subj, quiz.kp); return; }
  if (t.dataset.prompt) { showPrompt(t.dataset.prompt); return; }

  /* 听写 */
  if (t.dataset.dict) { current = "train"; renderTabs(); startDict(+t.dataset.dict); return; }
  if (t.dataset.play) { playDict(); return; }
  if (t.dataset.dcheck) { checkDict(); return; }
  if (t.dataset.dreveal) {
    const w = dict.words[dict.i];
    document.getElementById("dictVerdict").innerHTML =
      `<div class="verdict"><b>家长报词：${esc(w[0])}</b><p><em>${esc(w[1])}</em></p>
       <span class="src">请把单词读两遍、例句读一遍，然后让孩子拼写</span></div>`;
    return;
  }
  if (t.dataset.dnext) { nextDict(); return; }

  /* 口诀 */
  if (t.dataset.drill) { leave(); current = "train"; renderTabs(); startDrill(t.dataset.drill.split(",").map(Number)); return; }
  if (t.dataset.key) { drillKey(t.dataset.key); return; }
  if (t.dataset.quitdrill) { finishDrill(); return; }

  /* 限时测验 */
  if (t.dataset.exam) {
    leave(); current = "train"; renderTabs();
    const [s, n, m] = t.dataset.exam.split(",");
    startExam(s, +n, +m);
    return;
  }
  if (t.dataset.epick !== undefined) {
    exam.picks[exam.i] = +t.dataset.epick;
    renderExam();
    return;
  }
  if (t.dataset.emove) {
    exam.i = Math.min(Math.max(0, exam.i + +t.dataset.emove), exam.qs.length - 1);
    renderExam(); window.scrollTo({ top: 0 });
    return;
  }
  if (t.dataset.esubmit) { finishExam(); return; }
  if (t.dataset.quitexam) { finishExam(); return; }

  /* 知识图谱 */
  if (t.dataset.gfilter) { graphFilter = t.dataset.gfilter; renderGraph(); return; }
  if (t.dataset.gclear) { graphSel = null; renderGraph(); return; }
  if (t.dataset.node) {
    graphSel = (graphSel === t.dataset.node) ? null : t.dataset.node;
    renderGraph();
    return;
  }

  /* 错题本 */
  if (t.dataset.review) { current = "wrong"; renderTabs(); startReview(); return; }
  if (t.dataset.rpick !== undefined) { reviewPick(+t.dataset.rpick); return; }
  if (t.dataset.rnext) { reviewNext(); return; }
  if (t.id === "resetBtn") {
    progress = { kp: {}, checks: {} };
    save(); render();
    return;
  }
});

document.addEventListener("change", e => {
  const cb = e.target.closest("[data-check]");
  if (!cb) return;
  progress.checks[cb.dataset.check] = cb.checked;
  save();
});

render();
</script>
