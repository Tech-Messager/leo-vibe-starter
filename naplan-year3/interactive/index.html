<meta charset="utf-8">
<title>Chloe 的 NAPLAN Year 3 练习本</title>
<style>
  :root {
    --eucalypt: #2F6B4F;
    --eucalypt-soft: #E4EFE8;
    --wattle: #C98A16;
    --wattle-soft: #FBF0D8;
    --sky: #356F8F;
    --sky-soft: #E3EDF3;
    --coral: #C2453D;
    --coral-soft: #FBE7E5;
    --plum: #6B4E8F;
    --plum-soft: #EDE7F4;
    --ink: #161C19;
    --slate: #5C6B64;
    --hairline: #DDE3DE;
    --paper: #F6F7F4;
    --card: #FFFFFF;
    --card-sunk: #F1F3EF;
    --on-accent: #FFFFFF;

    --ui: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    --read: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --data: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;

    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 22px;
    --shadow: 0 1px 2px rgba(22, 28, 25, .05), 0 6px 18px -8px rgba(22, 28, 25, .14);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --eucalypt: #74C39A;
      --eucalypt-soft: #1E2E26;
      --wattle: #E8B75A;
      --wattle-soft: #302719;
      --sky: #7FB4D2;
      --sky-soft: #1B282F;
      --coral: #E8837B;
      --coral-soft: #33201E;
      --plum: #B79BD6;
      --plum-soft: #241E30;
      --ink: #E7EDE9;
      --slate: #9BAAA2;
      --hairline: #2C3833;
      --paper: #121614;
      --card: #1A211E;
      --card-sunk: #151B18;
      --on-accent: #10201A;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -10px rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --eucalypt: #74C39A;
    --eucalypt-soft: #1E2E26;
    --wattle: #E8B75A;
    --wattle-soft: #302719;
    --sky: #7FB4D2;
    --sky-soft: #1B282F;
    --coral: #E8837B;
    --coral-soft: #33201E;
    --plum: #B79BD6;
    --plum-soft: #241E30;
    --ink: #E7EDE9;
    --slate: #9BAAA2;
    --hairline: #2C3833;
    --paper: #121614;
    --card: #1A211E;
    --card-sunk: #151B18;
    --on-accent: #10201A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -10px rgba(0, 0, 0, .6);
  }

  :root[data-theme="light"] {
    --eucalypt: #2F6B4F;
    --eucalypt-soft: #E4EFE8;
    --wattle: #C98A16;
    --wattle-soft: #FBF0D8;
    --sky: #356F8F;
    --sky-soft: #E3EDF3;
    --coral: #C2453D;
    --coral-soft: #FBE7E5;
    --plum: #6B4E8F;
    --plum-soft: #EDE7F4;
    --ink: #161C19;
    --slate: #5C6B64;
    --hairline: #DDE3DE;
    --paper: #F6F7F4;
    --card: #FFFFFF;
    --card-sunk: #F1F3EF;
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(22, 28, 25, .05), 0 6px 18px -8px rgba(22, 28, 25, .14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 18px 72px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--hairline);
  }
  .head-in {
    max-width: 940px; margin: 0 auto; padding: 14px 18px 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .brand h1 {
    margin: 0; font-size: 1.28rem; font-weight: 700; letter-spacing: -.01em;
    text-wrap: balance;
  }
  /* 四线格：澳洲小学书写练习纸的虚线格，作为标题下的装饰 */
  .brand h1::after {
    content: ""; display: block; height: 9px; margin-top: 5px;
    background:
      linear-gradient(to bottom, transparent 0 3px, var(--hairline) 3px 4px, transparent 4px 9px),
      repeating-linear-gradient(to right, var(--wattle) 0 5px, transparent 5px 10px);
    background-size: 100% 100%, 100% 1px;
    background-position: 0 0, 0 6px;
    background-repeat: no-repeat, repeat-x;
    opacity: .8;
  }
  .brand p { margin: 6px 0 0; font-size: .8rem; color: var(--slate); }

  .head-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; padding-top: 2px; }
  .ring { display: grid; place-items: center; width: 52px; height: 52px; position: relative; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring b { font-family: var(--data); font-size: .78rem; font-variant-numeric: tabular-nums; }

  .lang-sw {
    display: inline-flex; border: 1px solid var(--hairline); border-radius: 100px;
    overflow: hidden; background: var(--card);
  }
  .lang-sw button {
    border: none; background: none; color: var(--slate); cursor: pointer;
    font-family: var(--ui); font-size: .78rem; font-weight: 700; padding: 7px 11px;
  }
  .lang-sw button:hover { color: var(--ink); }
  .lang-sw button[aria-pressed="true"] { background: var(--eucalypt); color: var(--on-accent); }

  /* 双语：中文作为英文的补充，小字弱化 */
  .zh { color: var(--slate); font-weight: 500; font-size: .86em; margin-left: 7px; }
  .zh-b {
    display: block; color: var(--slate); font-size: .88em; font-weight: 400;
    margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--hairline);
  }
  .verdict .zh-b, .gd-tip .zh-b { border-top-color: currentColor; opacity: .75; }

  .icon-btn {
    border: 1px solid var(--hairline); background: var(--card); color: var(--slate);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: .95rem; display: grid; place-items: center; padding: 0;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--slate); }

  /* ---------- tabs ---------- */
  nav {
    max-width: 940px; margin: 0 auto; padding: 10px 18px 12px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; border: 1px solid var(--hairline); background: var(--card);
    color: var(--slate); font-family: var(--ui); font-size: .88rem; font-weight: 600;
    padding: 7px 15px; border-radius: 100px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] {
    background: var(--eucalypt); border-color: var(--eucalypt);
    color: var(--on-accent);
  }

  /* ---------- generic ---------- */
  h2 { font-size: 1.05rem; margin: 30px 0 4px; letter-spacing: -.01em; }
  h2 .en { font-weight: 500; color: var(--slate); font-size: .82rem; margin-left: 7px; }
  .lede { margin: 0 0 16px; color: var(--slate); font-size: .88rem; max-width: 62ch; }

  .eyebrow {
    font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--slate); margin: 26px 0 8px;
  }

  button, [role="button"] { font-family: var(--ui); }
  :focus-visible { outline: 2.5px solid var(--wattle); outline-offset: 2px; border-radius: 4px; }

  /* ---------- knowledge point cards ---------- */
  .kp-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
  .kp {
    text-align: left; background: var(--card); border: 1px solid var(--hairline);
    border-radius: var(--r-md); padding: 13px 15px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s, transform .12s, box-shadow .15s;
  }
  .kp:hover { border-color: var(--eucalypt); transform: translateY(-1px); box-shadow: var(--shadow); }
  .kp-name { font-weight: 650; font-size: .95rem; line-height: 1.35; }
  .kp-en { font-size: .74rem; color: var(--slate); font-weight: 500; }
  .kp-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
  .kp-count { font-family: var(--data); font-size: .72rem; color: var(--slate); font-variant-numeric: tabular-nums; }

  .pill {
    font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 100px;
    letter-spacing: .01em; white-space: nowrap;
  }
  .pill.new  { background: var(--card-sunk); color: var(--slate); }
  .pill.mid  { background: var(--wattle-soft); color: var(--wattle); }
  .pill.done { background: var(--eucalypt-soft); color: var(--eucalypt); }
  .pill.weak { background: var(--coral-soft); color: var(--coral); }

  .bar { height: 5px; border-radius: 99px; background: var(--card-sunk); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--eucalypt); border-radius: 99px; transition: width .35s ease; }
  .bar i.w { background: var(--coral); }
  .bar i.m { background: var(--wattle); }

  /* ---------- quiz ---------- */
  .quiz-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 22px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline);
  }
  .back {
    border: 1px solid var(--hairline); background: var(--card); color: var(--slate);
    border-radius: 100px; padding: 6px 14px; font-size: .82rem; font-weight: 600; cursor: pointer;
  }
  .back:hover { color: var(--ink); border-color: var(--slate); }
  .quiz-title { font-weight: 700; font-size: 1rem; }
  .dots { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--card-sunk); border: 1px solid var(--hairline); }
  .dot.ok { background: var(--eucalypt); border-color: var(--eucalypt); }
  .dot.no { background: var(--coral); border-color: var(--coral); }
  .dot.now { box-shadow: 0 0 0 3px var(--wattle-soft); border-color: var(--wattle); }

  .passage {
    background: var(--card); border: 1px solid var(--hairline); border-left: 3px solid var(--sky);
    border-radius: var(--r-md); padding: 16px 20px; margin-bottom: 18px;
    max-height: 300px; overflow-y: auto;
    font-family: var(--read); font-size: .97rem; line-height: 1.68;
  }
  .passage h4 {
    font-family: var(--ui); font-size: .74rem; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--sky); margin: 0 0 10px;
  }
  .passage p { margin: 0 0 .8em; }
  .passage p:last-child { margin-bottom: 0; }
  .passage em { font-style: italic; }
  .passage .sub { font-style: italic; font-weight: 600; }

  .q-card { background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); }
  .q-meta { font-family: var(--data); font-size: .7rem; color: var(--slate); margin-bottom: 9px; }
  .q-text { font-size: 1.06rem; font-weight: 600; line-height: 1.5; margin: 0 0 16px; text-wrap: pretty; }
  .q-text.serif { font-family: var(--read); font-weight: 500; }

  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; align-items: flex-start; gap: 11px; width: 100%; text-align: left;
    background: var(--card); border: 1.5px solid var(--hairline); border-radius: var(--r-md);
    padding: 12px 14px; cursor: pointer; font-size: .97rem; color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--eucalypt); background: var(--eucalypt-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--card-sunk); color: var(--slate);
    display: grid; place-items: center; font-family: var(--data); font-size: .78rem; font-weight: 700;
  }
  .opt .body { padding-top: 1px; }
  .opt.correct { border-color: var(--eucalypt); background: var(--eucalypt-soft); }
  .opt.correct .letter { background: var(--eucalypt); color: var(--card); }
  .opt.wrong { border-color: var(--coral); background: var(--coral-soft); }
  .opt.wrong .letter { background: var(--coral); color: var(--card); }
  .opt.dim { opacity: .5; }

  .verdict {
    margin-top: 16px; padding: 14px 16px; border-radius: var(--r-md);
    background: var(--card-sunk); border-left: 3px solid var(--slate);
  }
  .verdict.good { background: var(--eucalypt-soft); border-left-color: var(--eucalypt); }
  .verdict.bad  { background: var(--coral-soft); border-left-color: var(--coral); }
  .verdict b { display: block; font-size: .92rem; margin-bottom: 4px; }
  .verdict p { margin: 0; font-size: .88rem; line-height: 1.6; }
  .verdict .src { display: block; margin-top: 8px; font-family: var(--data); font-size: .7rem; color: var(--slate); }

  .q-nav { display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 100px; padding: 11px 22px; font-size: .93rem; font-weight: 700;
    cursor: pointer; background: var(--eucalypt); color: var(--on-accent);
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid var(--hairline); color: var(--slate); font-weight: 600; }
  .btn.ghost:hover { color: var(--ink); border-color: var(--slate); }

  .score-card {
    text-align: center; background: var(--card); border: 1px solid var(--hairline);
    border-radius: var(--r-lg); padding: 32px 24px; box-shadow: var(--shadow);
  }
  .score-big { font-family: var(--data); font-size: 2.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .score-card p { color: var(--slate); font-size: .9rem; margin: 10px 0 20px; }
  .wrongs { text-align: left; margin: 20px auto 0; max-width: 480px; }
  .wrongs h5 { font-size: .8rem; margin: 0 0 8px; color: var(--slate); font-weight: 700; }
  .wrongs li { font-size: .86rem; margin-bottom: 6px; line-height: 1.5; }

  /* ---------- 树状框架图（自绘，字号固定不缩放） ---------- */
  .tree {
    background: var(--card); border: 1px solid var(--hairline); border-radius: var(--r-md);
    padding: 18px 20px 20px; margin-bottom: 16px;
  }
  .tree-root {
    display: inline-flex; align-items: baseline; gap: 9px;
    background: var(--acc-soft); color: var(--acc);
    border-radius: 100px; padding: 8px 19px; font-weight: 750; font-size: 1.14rem;
    margin-bottom: 6px;
  }
  .tree-root small { font-weight: 600; font-size: .82rem; opacity: .85; }

  .branches { display: grid; row-gap: 6px; column-gap: 24px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

  .branch { padding: 12px 0 4px 20px; position: relative; }
  /* 竖向连接线 */
  .branch::before {
    content: ""; position: absolute; left: 4px; top: 0; bottom: 10px;
    border-left: 2px solid var(--hairline); border-radius: 2px;
  }
  .branch-head {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; position: relative;
  }
  /* 横向连接线 + 节点圆点 */
  .branch-head::before {
    content: ""; position: absolute; left: -16px; top: .62em; width: 11px;
    border-top: 2px solid var(--hairline);
  }
  .branch-head::after {
    content: ""; position: absolute; left: -8px; top: calc(.62em - 3px);
    width: 8px; height: 8px; border-radius: 50%; background: var(--acc);
  }
  .branch-head em {
    font-style: normal; font-weight: 600; font-size: .8rem; color: var(--slate);
    background: var(--card-sunk); border-radius: 5px; padding: 2px 7px;
  }

  .leaves { list-style: none; margin: 0; padding: 0 0 0 2px; }
  .leaves li {
    position: relative; padding: 6px 0 6px 17px;
    font-size: 1.03rem; line-height: 1.45;
  }
  .leaves li::before {
    content: ""; position: absolute; left: 2px; top: .78em;
    width: 8px; border-top: 1.5px solid var(--acc); opacity: .55;
  }
  .leaves li b { font-weight: 650; }
  .leaves li span { display: block; color: var(--slate); font-size: .91rem; margin-top: 2px; line-height: 1.5; }
  .leaves li.hot b { color: var(--coral); }
  .leaves li.hot::before { border-color: var(--coral); opacity: 1; }

  /* 决策树 */
  .flow { display: flex; flex-direction: column; gap: 0; }
  .flow-q {
    background: var(--card-sunk); border-radius: var(--r-sm);
    padding: 11px 16px; font-weight: 700; font-size: 1.08rem;
  }
  .flow-yes {
    margin: 8px 0 8px 26px; padding: 12px 16px;
    border: 1.5px solid var(--acc); background: var(--acc-soft);
    border-radius: var(--r-sm); font-size: 1rem;
  }
  .flow-yes b { display: block; font-size: 1.06rem; margin-bottom: 3px; }
  .flow-yes span { color: var(--slate); font-size: .91rem; }
  .flow-tag {
    display: inline-block; font-size: .74rem; font-weight: 700; color: var(--slate);
    margin: 0 0 0 6px;
  }
  .flow-arrow { color: var(--slate); font-size: .8rem; padding-left: 6px; margin: 2px 0; }

  .map-note { color: var(--slate); font-size: .86rem; margin: 0 0 20px; }

  

function renderShop() {
  const L = look(), own = owned();
  view.innerHTML = `
    <h2>${T("我的形象", "My Character")}<span class="en">${Tp("赚金币，换装扮", "Earn coins, dress up")}</span></h2>
    <p class="lede">${TB("金币来自<strong>乘法口诀抢答</strong>：答对一题 +3，3 分钟答对 25 题以上再 +40。用它换发型、衣服、围巾、帽子、宠物和背景 —— 共 54 件，还有 5 套整买更便宜的主题套装。",
      "Coins come from the <strong>times tables sprint</strong>: +3 for each correct answer, and +40 for 25 or more in three minutes. Spend them on hair, outfits, scarves, hats, pets and scenes — 54 items in all, plus 5 themed sets that cost less bought together.")}</p>

    <div class="av-stage">
      <div class="av-big">${avatarSvg(200)}</div>
      <div class="av-side">
        <div class="av-coins"><span class="c-ic">🪙</span><b>${coins()}</b></div>
        <div class="av-note">${TB("累计赚到 " + (progress.earned || 0) + " 枚金币 · 已拥有 " + owned().length + " / " + Object.values(SHOP).reduce((a, c) => a + c.items.length, 0) + " 件",
          "Earned " + (progress.earned || 0) + " coins in total · " + owned().length + " of " + Object.values(SHOP).reduce((a, c) => a + c.items.length, 0) + " items unlocked")}</div>
        <div class="av-rate">
          <div>${T("口诀答对一题", "Each tables answer")}<b>+${COIN.perAnswer}</b></div>
          <div>${T("3 分钟答对 25 题以上", "25+ in 3 minutes")}<b>+${COIN.sprint25}</b></div>
        </div>
        <p class="av-hint">${TB("金币只从<strong>乘法口诀抢答</strong>赚 —— 口诀是唯一靠反复练熟的东西，用金币推它正合适。别的学习不发金币，因为那些本身应该有意思。",
          "Coins come only from the <strong>times tables sprint</strong>. Tables are the one thing that just needs drilling, so a reward fits there. Nothing else pays coins — the rest should be worth doing for its own sake.")}</p>
      </div>
    </div>

    <p class="eyebrow">${T("主题套装 · 整套买更便宜", "Themed sets · cheaper together")}</p>
    <div class="set-grid">
      ${SETS.map(st => {
        const own = owned(), pr = setPrice(st);
        const all = Object.values(st.pick).every(i => own.includes(i));
        const wearing = Object.entries(st.pick).every(([c, i]) => look()[c] === i);
        return `<button class="set-card ${wearing ? "on" : ""} ${all ? "has" : coins() >= pr ? "" : "cant"}"
            data-set="${st.id}">
          <div class="sc-prev">${setPreview(st)}</div>
          <div class="sc-b">
            <b>${T(esc(st.zh), esc(st.en))}</b>
            <span>${Object.keys(st.pick).map(c => T(SHOP[c].zh, SHOP[c].en)).join(" · ")}</span>
          </div>
          <div class="sc-p">${wearing ? T("正在穿", "Wearing") : all ? T("全部拥有 · 一键换上", "Owned · wear it") : `🪙 ${pr}`}</div>
        </button>`;
      }).join("")}
    </div>

    ${Object.entries(SHOP).map(([cat, c]) => `
      <p class="eyebrow">${c.ic} ${T(c.zh, c.en)} <span class="own-n">${
        c.items.filter(i => owned().includes(i[0])).length}/${c.items.length}</span></p>
      <div class="shop-grid">
        ${c.items.map(([id, zh, en, price]) => {
          const has = own.includes(id), on = L[cat] === id, can = coins() >= price;
          return `<button class="shop-item ${on ? "on" : ""} ${has ? "has" : can ? "" : "cant"}"
              data-buy="${cat}:${id}:${price}">
            <div class="si-prev">${previewSvg(cat, id)}</div>
            <div class="si-n">${T(esc(zh), esc(en))}</div>
            <div class="si-p">${on ? T("使用中", "Wearing") : has ? T("已拥有", "Owned") : `🪙 ${price}`}</div>
          </button>`;
        }).join("")}
      </div>`).join("")}`;
}

function setPreview(st) {
  const real = progress.look;
  progress.look = Object.assign({}, look(), st.pick);
  const svg = avatarSvg(72);
  progress.look = real;
  return svg;
}
function buySet(id) {
  const st = SETS.find(x => x.id === id); if (!st) return;
  const own = owned(), pr = setPrice(st);
  const all = Object.values(st.pick).every(i => own.includes(i));
  if (!all) {
    if (!spendCoins(pr)) {
      const el = document.querySelector(`[data-set="${id}"]`);
      if (el) { el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 450); }
      return;
    }
    Object.values(st.pick).forEach(i => { if (!own.includes(i)) own.push(i); });
  }
  Object.entries(st.pick).forEach(([c, i]) => { look()[c] = i; });
  save(); updateCoinUI(); renderShop();
}

/* 商店缩略图：临时套用该项后渲染小图 */
function previewSvg(cat, id) {
  const real = progress.look;
  progress.look = Object.assign({}, look(), { [cat]: id });
  const svg = avatarSvg(64);
  progress.look = real;
  return svg;
}

function buyOrWear(cat, id, price) {
  const own = owned();
  if (!own.includes(id)) {
    if (!spendCoins(price)) {
      const el = document.querySelector(`[data-buy="${cat}:${id}:${price}"]`);
      if (el) { el.classList.add("shake"); setTimeout(() => el.classList.remove("shake"), 450); }
      return;
    }
    own.push(id);
  }
  look()[cat] = id;
  save(); updateCoinUI(); renderShop();
}

    <p>Wombats live in burrows, which are long tunnels they dig under the ground. A wombat's burrow can be up to 30 metres long. Wombats sleep in their burrows during the day and come out at night to eat. Animals that are active at night are called <strong>nocturnal</strong>.</p>

    <p>Wombats are the only animals in the world that do cube-shaped poo! Scientists believe the cube shape stops it from rolling away, which helps wombats mark their territory.</p>` },

    <p>2 paper cups &middot; a long piece of string (about 5 metres) &middot; a sharp pencil &middot; a friend</p>

    <p>1. Use the pencil to poke a small hole in the bottom of each cup.<br>

        { q: "Pencils come in packs of 6. Mia buys 4 packs, then gives 5 pencils to her brother. How many does she have left?", o: ["19", "24", "29", "14"], a: 0, e: "三步：4×6＝24；24−5＝19。", s: "拓展 M1" },

        { q: "A rectangle has a perimeter of 26 cm. One side is 8 cm. How long is the side next to it?", o: ["5 cm", "9 cm", "13 cm", "18 cm"], a: 0, e: "两条 8 cm 共 16；26−16＝10；10÷2＝5 cm。", s: "拓展 M5" },
        { q: "What is the next number? 1, 3, 7, 15, __", o: ["23", "31", "30", "22"], a: 1, e: "规律是「×2 再 ＋1」：15×2＋1＝31。", s: "拓展 M6" }

        { q: "96 lollies are shared equally between 8 children. How many does each get?", o: ["11", "12", "13", "8"], a: 1, e: "96÷8＝12。想 8×12＝96。", s: "拓展 M9" },

        { q: "A number rounded to the nearest ten is 70. What is the SMALLEST it could be?", o: ["60", "65", "66", "71"], a: 1, e: "65 四舍五入到十位是 70；64 就变成 60 了。逆向 rounding。", s: "拓展 M11" },
        { q: "3 boxes hold 12 books each. 2 boxes hold 9 books each. How many books altogether?", o: ["54", "42", "63", "36"], a: 0, e: "两组分别算再相加：3×12＝36；2×9＝18；36＋18＝54。", s: "拓展 M12" }

/* ============================================================
   进度存储
   ============================================================ */
const STORE = "chloe-naplan-v1";
const BLANK = { kp: {}, checks: {}, wrong: {}, spell: {}, drill: { best: 0, runs: [] }, tests: [] };
let progress = load();
function load() {
  let p;
  try { p = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { p = {}; }
  for (const k in BLANK) if (p[k] === undefined) p[k] = JSON.parse(JSON.stringify(BLANK[k]));
  return p;
}

/* ---- 错题本 · 间隔复习：答对后隔 1→3→7→21 天再考，全部熬过才算真记住 ---- */
const INTERVALS = [1, 3, 7, 21];
function wrongKey(subj, kp, i) { return subj + "::" + kp + "::" + i; }
function markWrong(subj, kp, i) {
  const k = wrongKey(subj, kp, i);
  const w = progress.wrong[k] || { times: 0, box: 0 };
  w.times++; w.box = 0; w.due = Date.now(); w.at = Date.now();
  progress.wrong[k] = w; save();
}
function markRight(subj, kp, i) {
  const k = wrongKey(subj, kp, i), w = progress.wrong[k];
  if (!w) return false;
  w.box = (w.box || 0) + 1;
  if (w.box >= INTERVALS.length) { delete progress.wrong[k]; save(); return true; }
  w.due = Date.now() + INTERVALS[w.box - 1] * 864e5;
  progress.wrong[k] = w; save();
  return false;
}
/* 今天到期该复习的 */
function dueList() { return wrongList().filter(w => (w.meta.due || 0) <= Date.now()); }
function nextDueIn(w) {
  const d = Math.ceil(((w.meta.due || 0) - Date.now()) / 864e5);
  return d <= 0 ? 0 : d;
}
function wrongList() {
  return Object.keys(progress.wrong).map(k => {
    const [subj, kp, i] = k.split("::");
    const g = BANK[subj] && BANK[subj].groups.find(x => x.kp === kp);
    if (!g || !g.qs[+i]) return null;
    return { subj, kp, i: +i, q: g.qs[+i], meta: progress.wrong[k] };
  }).filter(Boolean).sort((a, b) => (a.meta.due || 0) - (b.meta.due || 0) || b.meta.times - a.meta.times);
}
function save() {
  progress.updatedAt = Date.now();
  try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
  if (typeof syncSoon === "function") syncSoon();
}
function kpKey(subj, kp) { return subj + "::" + kp; }
function kpStat(subj, kp) {
  return progress.kp[kpKey(subj, kp)] || { done: 0, right: 0, total: 0 };
}
function recordRun(subj, kp, right, total) {
  progress.kp[kpKey(subj, kp)] = { done: 1, right, total, at: Date.now() };
  save();
}

function coins() { return progress.coins || 0; }
function addCoins(n, why) {
  if (n <= 0) return;
  progress.coins = coins() + n;
  progress.earned = (progress.earned || 0) + n;
  save(); updateCoinUI();
  coinPop(n, why);
}
function spendCoins(n) {
  if (coins() < n) return false;
  progress.coins = coins() - n; save(); updateCoinUI(); return true;
}
function updateCoinUI() {
  const el = document.getElementById("coinN");
  if (el) el.textContent = coins();
  const av = document.getElementById("headAvatar");
  if (av) av.innerHTML = avatarSvg(28);
}
function coinPop(n, why) {
  const host = document.getElementById("coinBox");
  if (!host) return;
  const e = document.createElement("span");
  e.className = "coin-pop";
  e.textContent = "+" + n;
  e.title = why || "";
  host.appendChild(e);
  setTimeout(() => e.remove(), 1400);
}

function look() { progress.look = Object.assign({}, DEFAULT_LOOK, progress.look || {}); return progress.look; }
function freeItems() { return Object.values(SHOP).flatMap(c => c.items.filter(i => i[3] === 0).map(i => i[0])); }
function owned() {
  progress.owned = progress.owned || [];
  freeItems().forEach(i => { if (!progress.owned.includes(i)) progress.owned.push(i); });
  return progress.owned;
}
function priceOf(cat, id) { const it = SHOP[cat].items.find(x => x[0] === id); return it ? it[3] : 0; }
function setPrice(st) {
  const own = owned();
  const raw = Object.entries(st.pick).reduce((a, [c, i]) => a + (own.includes(i) ? 0 : priceOf(c, i)), 0);
  return Math.round(raw * st.off);
}

function earn(id) {
  if (!progress.badges) progress.badges = {};
  if (progress.badges[id]) return null;
  progress.badges[id] = Date.now(); save();
  return BADGES.find(b => b.id === id);
}

function touchStreak() {
  const today = new Date().toISOString().slice(0, 10);
  const s = progress.streak || { last: "", days: 0 };
  if (s.last === today) return s;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  s.days = (s.last === y) ? s.days + 1 : 1;
  s.last = today;
  progress.streak = s; save();
  if (s.days >= 3) earn("streak3");
  if (s.days >= 7) earn("streak7");
  return s;
}

function checkAllDone() {
  const pl = planState(), k = todayKey();
  pl.bonus = pl.bonus || {};
  if (pl.bonus[k]) return;
  const done = doneToday();
  if (todayTasks().every(t => done.includes(t.id))) {
    pl.bonus[k] = 1; save();
    const lb = progress.lastBackup ? Date.now() - new Date(progress.lastBackup) : Infinity;
    if (lb > 7 * 864e5) progress.needBackup = 1;
    const ch = unlockChapter();
    if (ch) toast({ icon: "📖", n: "解锁第 " + ch + " 章", en: "Chapter " + ch + " unlocked",
                    d: "去「我的收获」读", de: "Read it in My Rewards" });
  }
}

function checkMilestones() {
  let totalQ = 0, perfect = 0;
  Object.values(progress.kp).forEach(s => {
    totalQ += s.total || 0;
    if (s.total && s.right === s.total) perfect++;
  });
  if (totalQ >= 1) earn("first");
  if (totalQ >= 100) earn("hundred");
  if (perfect >= 1) earn("perfect");
  if (perfect >= 5) earn("perfect5");
  if ((progress.cleared || 0) >= 5) earn("fixer");
  for (const id in BANK) {
    const all = BANK[id].groups.every(g => {
      const st = kpStat(id, g.kp);
      return st.total && st.right / st.total >= .85;
    });
    if (all) earn("master");
  }
}

const CHEERS = [["答对了！", "Correct!"], ["很好！", "Well done!"], ["就是这样 👏", "That's it 👏"],

  ["稳！", "Spot on!"], ["对了，继续保持！", "Yes — keep it up!"]];
function cheer() { const c = CHEERS[Math.floor(Math.random() * CHEERS.length)]; return Tp(c[0], c[1]); }

function toast(badge) {
  if (!badge) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="t-icon">${badge.icon}</span><span><b>${
    Tp(badge.n.length > 8 ? badge.n : "获得徽章：" + badge.n, badge.en.length > 12 ? badge.en : "Badge earned: " + badge.en)
    }</b><small>${Tp(badge.d, badge.de)}</small></span>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("in"), 20);
  setTimeout(() => { el.classList.remove("in"); setTimeout(() => el.remove(), 400); }, 3200);
}

function SRC(x) { return lang === "zh" ? esc(x) : esc(srcEn(x)); }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- 语言：en 只英文 / both 英文为主中文为辅 / zh 只中文 ---------- */
let lang = (() => { try { return localStorage.getItem("chloe-lang") || "both"; } catch (e) { return "both"; } })();
function setLang(v) { lang = v; try { localStorage.setItem("chloe-lang", v); } catch (e) {} }

/* 行内双语：英文在前，中文小字在后 */
function T(zh, en) {
  if (!en) return zh;
  if (lang === "en") return en;
  if (lang === "zh") return zh;
  return `${en}<span class="zh">${zh}</span>`;
}
/* 块级双语：英文一段，中文另起一行 */
function TB(zh, en) {
  if (!en) return zh;
  if (lang === "en") return en;
  if (lang === "zh") return zh;
  return `${en}<span class="zh-b">${zh}</span>`;
}
/* 属性（placeholder / title / aria-label）用纯文本，不能带标签 */
function Tp(zh, en) { if (!en) return zh; return lang === "zh" ? zh : en; }

/* 查表式双语：优先 EN_TREE，其次原样 */
function TX(zh) { const en = (typeof EN_TREE !== "undefined" && EN_TREE[zh]) || ""; return T(esc(zh), en ? esc(en) : ""); }
function TXB(zh) { const en = (typeof EN_TREE !== "undefined" && EN_TREE[zh]) || ""; return TB(esc(zh), en ? esc(en) : ""); }

/* 只在非英文模式显示的中文（纯家长向内容） */

function masteryOf(st) {
  if (!st.total) return { cls: "new", txt: Tp("未开始", "Not started"), pct: 0 };

  if (pct >= 85) return { cls: "done", txt: Tp("已掌握 " + pct + "%", "Mastered " + pct + "%"), pct };
  if (pct >= 60) return { cls: "mid",  txt: Tp("再练练 " + pct + "%", "Almost " + pct + "%"), pct };

/* 真实考试的平均配速：数学 75 秒/题，阅读 69，语言 67 */
const PACE = { numeracy: 75, reading: 69, conventions: 67, challenge: 90 };

function startQuiz(subj, kpName) {

function renderQuiz() {
  const { group, i, results } = quiz;

  const txt = isReading && q.t ? READING_TEXTS[q.t] : null;

  const dots = group.qs.map((_, n) => {

    </div>
    ${txt ? `<div class="passage"><h4>${T(esc(txt.type) + " " + esc(txt.typeZh || ""), esc(txt.type))} — ${esc(txt.title)}</h4>${txt.html}</div>` : ""}
    <div class="q-card">
      <div class="q-meta">${Tp(`第 ${i + 1} / ${group.qs.length} 题`, `Question ${i + 1} of ${group.qs.length}`)} · ${
        lang === "zh" ? esc(quiz.kp) : esc(BANK[quiz.subj].groups.find(g => g.kp === quiz.kp).en)}</div>
      <p class="q-text ${isReading ? "serif" : ""}">${q.q}</p>
      <div class="opts" id="opts">

    </div>`;
}

function pick(n) {
  if (quiz.answered) return;
  quiz.answered = true;
  const q = quiz.group.qs[quiz.i];
  const ok = n === q.a;
  quiz.results[quiz.i] = ok;
  quiz.times[quiz.i] = Math.max(1, Date.now() - quiz.qStart);
  if (ok) markRight(quiz.subj, quiz.kp, quiz.i); else markWrong(quiz.subj, quiz.kp, quiz.i);


  document.querySelectorAll("#opts .opt").forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.a) b.classList.add("correct");
    else if (idx === n) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  document.getElementById("verdict").innerHTML = `
    <div class="verdict ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ " + cheer() : Tp("✗ 正确答案是 " + "ABCD"[q.a], "✗ The answer is " + "ABCD"[q.a])}</b>
      <p>${TB(q.e, EN_EXP[q.s])}</p>
      <span class="src">${SRC(q.s)}</span>
    </div>`;

  const tgt = PACE[quiz.subj] || 70, spent = Math.round(quiz.times[quiz.i] / 1000);
  if (spent > tgt * 2) {
    document.getElementById("verdict").insertAdjacentHTML("beforeend",
      `<div class="pace-warn">⏱️ ${TB("这题花了 " + spent + " 秒，比考试节奏（约 " + tgt + " 秒）慢不少。考试时遇到卡住的题，<strong>先跳过，最后回来做</strong> —— 别把时间耗在一道题上。",
        "That took " + spent + "s — well over the test pace of about " + tgt + "s. In the real test, <strong>skip a sticky question and come back at the end</strong>. Never sink your time into one question.")}</div>`);
  }
  const last = quiz.i === quiz.group.qs.length - 1;
  document.getElementById("qnav").innerHTML =
    `<button class="btn" data-next="1">${last ? Tp("看成绩","See score") : Tp("下一题 →","Next →")}</button>`;

  document.querySelectorAll(".dot")[quiz.i].className = "dot " + (ok ? "ok" : "no") + " now";
}

function next() {
  if (quiz.i === quiz.group.qs.length - 1) return finish();
  quiz.i++;
  quiz.answered = false;
  quiz.qStart = Date.now();
  renderQuiz();
}

function finish() {
  const total = quiz.group.qs.length;
  const right = quiz.results.filter(Boolean).length;
  recordRun(quiz.subj, quiz.kp, right, total);
  markTask("kp:" + quiz.subj + ":" + quiz.kp);
  checkAllDone();
  touchStreak();
  checkMilestones();
  renderTabs();
  if (right === total) toast(earn("perfect"));
  const pct = Math.round(right / total * 100);
  const wrongIdx = quiz.results.map((r, n) => r ? -1 : n).filter(n => n >= 0);

  const msg = pct === 100 ? Tp("全对！这个知识点可以打勾了 🎉", "All correct! You can tick this topic off 🎉")
    : pct >= 85 ? Tp("很好，基本掌握了。错的那题看一遍讲解就行。", "Great — you have this. Just read the explanation for the one you missed.")
    : pct >= 60 ? Tp("有进步空间 —— 把错题的讲解读一遍，明天再做一次这一组。", "Getting there — read the explanations, then do this set again tomorrow.")
    : Tp("这个知识点先回《知识点.md》重新学一遍，两天后再来做。不着急。", "Learn this topic again first, then come back in a couple of days. No rush.");

  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-back="${quiz.subj}">← ${lang === "zh" ? BANK[quiz.subj].label : BANK[quiz.subj].en}</button>
      <span class="quiz-title">${esc(lang === "zh" ? quiz.kp : quiz.group.en)} · ${Tp("成绩","score")}</span>
    </div>
    <div class="score-card">
      <div class="score-big">${right}<span style="font-size:1.4rem;color:var(--slate)">/${total}</span></div>
      <p>${msg}</p>
      <div class="q-nav" style="justify-content:center">
        <button class="btn" data-retry="1">${Tp("再做一次","Try again")}</button>
        <button class="btn ghost" data-back="${quiz.subj}">${Tp("回到 " + BANK[quiz.subj].label, "Back to " + BANK[quiz.subj].en)}</button>
      </div>
      ${paceReport()}
      ${wrongIdx.length ? `<div class="wrongs">
        <h5>${T("要复习的题（" + wrongIdx.length + " 题）", "Questions to review (" + wrongIdx.length + ")")}</h5>
        <ul>${wrongIdx.map(n => `<li>${quiz.group.qs[n].q.replace(/<[^>]+>/g, "")} <span style="color:var(--slate)">— ${SRC(quiz.group.qs[n].s)}</span></li>`).join("")}</ul>
      </div>` : ""}
    </div>`;
}

function paceReport() {
  const ms = quiz.times.filter(x => x > 0);
  if (!ms.length) return "";
  const t = ms.map(x => Math.max(1, Math.round(x / 1000)));
  const total = t.reduce((a, b) => a + b, 0);
  const avg = Math.round(total / t.length);
  const tgt = PACE[quiz.subj] || 70;
  const slow = t.indexOf(Math.max(...t));
  const cls = avg <= tgt ? "good" : avg <= tgt * 1.4 ? "mid" : "slow";
  const msg = avg <= tgt
    ? Tp("比考试节奏还快 —— 很好。", "Faster than test pace — excellent.")
    : avg <= tgt * 1.4
      ? Tp("接近考试节奏了，再练几组就稳了。", "Close to test pace. A few more sets and it will be comfortable.")
      : Tp("目前比考试节奏慢。先别追速度 —— 先把方法练熟，快是自然的结果。", "Slower than test pace for now. Do not chase speed yet — get the method solid and speed follows.");
  return `<div class="pace">
    <div class="pace-h">⏱️ ${T("你的配速", "Your pace")}</div>
    <div class="pace-row"><span>${T("这一组用时", "Time for this set")}</span><b>${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}</b></div>
    <div class="pace-row"><span>${T("平均每题", "Average per question")}</span><b class="${cls}">${avg}s</b></div>
    <div class="pace-row"><span>${T("考试节奏", "Test pace")}</span><b>${tgt}s</b></div>
    <div class="pace-row"><span>${T("最慢的一题", "Slowest question")}</span><b>${T("第 " + (slow + 1) + " 题", "Q" + (slow + 1))} · ${t[slow]}s</b></div>
    <p class="pace-m">${msg}</p></div>`;
}

let wtimer = null;
const WPHASES = [
  { s: 300,  zh: "构思", en: "Plan",  zhD: "写提纲：谁·在哪·发生什么问题·怎么解决", enD: "Sketch a plan: who, where, what goes wrong, how it ends" },
  { s: 1800, zh: "写作", en: "Write", zhD: "一直写，别停下来改字", enD: "Keep writing — do not stop to fix words" },
  { s: 300,  zh: "检查", en: "Check", zhD: "专查：大写、句号、漏字、拼写", enD: "Check for: capitals, full stops, missing words, spelling" }
];
function startWTimer() {
  stopWTimer();
  wtimer = { phase: 0, left: WPHASES[0].s, t: null };
  wtimer.t = setInterval(() => {
    wtimer.left--;
    if (wtimer.left <= 0) {
      if (wtimer.phase < WPHASES.length - 1) { wtimer.phase++; wtimer.left = WPHASES[wtimer.phase].s; beep(); }
      else { stopWTimer(); renderWriting(); return; }
    }
    paintWTimer();
  }, 1000);
  renderWriting();
}
function stopWTimer() { if (wtimer && wtimer.t) clearInterval(wtimer.t); wtimer = null; }
function paintWTimer() {
  const el = document.getElementById("wtClock"), ph = document.getElementById("wtPhase");
  if (!el || !wtimer) return;
  el.textContent = fmtTime(wtimer.left);
  el.classList.toggle("low", wtimer.left <= 30);
  const P = WPHASES[wtimer.phase];
  if (ph) ph.innerHTML = `<b>${Tp(P.zh, P.en)}</b><span>${TB(esc(P.zhD), esc(P.enD))}</span>`;
  const bar = document.getElementById("wtBar");
  if (bar) bar.style.width = Math.round((1 - wtimer.left / WPHASES[wtimer.phase].s) * 100) + "%";
}
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 660;
    g.gain.setValueAtTime(.12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5);
    o.start(); o.stop(a.currentTime + .5);
  } catch (e) {}
}

   专项训练 1：拼写听写（浏览器语音，模拟真实考试的音频题）
   ============================================================ */
let voices = [];
function pickVoice() {
  if (!window.speechSynthesis) return null;
  if (!voices.length) voices = speechSynthesis.getVoices() || [];
  return voices.find(v => v.lang === "en-AU") || voices.find(v => v.lang === "en-GB")
      || voices.find(v => /^en/.test(v.lang)) || voices[0] || null;
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices() || []; };
  voices = speechSynthesis.getVoices() || [];
}
function say(parts) {
  if (!window.speechSynthesis) return false;
  speechSynthesis.cancel();
  const v = pickVoice();
  parts.forEach(txt => {
    const u = new SpeechSynthesisUtterance(txt);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-AU";
    u.rate = .8; u.pitch = 1;
    speechSynthesis.speak(u);
  });
  return true;
}

let dict = null;
function startDict(lv) {
  const set = SPELL[lv];
  const words = set.w.slice().sort(() => Math.random() - .5).slice(0, 10);
  dict = { lv, set, words, i: 0, results: [], revealed: false };
  renderDict();
}

function renderDict() {
  if (!dict) return renderTrain();
  const { words, i, results } = dict;
  const w = words[i];
  const dots = words.map((_, n) => {
    const r = results[n];
    return `<span class="dot ${r === undefined ? "" : r ? "ok" : "no"} ${n === i ? "now" : ""}"></span>`;
  }).join("");

  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-tab2="train">← ${T("专项训练","Drills")}</button>
      <span class="quiz-title">${Tp("听写","Dictation")} · ${esc(lang === "zh" ? dict.set.lv : dict.set.lvEn)}</span>
      <span class="dots">${dots}</span>
    </div>
    <div class="panel" style="border-left:3px solid var(--wattle)">
      <p class="sub" style="margin:0"><strong>老师说 ·</strong> 真实考试是「读单词 → 读例句 → 再读一次单词」，然后你输入拼写。听不清可以重放，考试时也允许重听。</p>
    </div>
    <div class="q-card">
      <div class="q-meta">${Tp(`第 ${i + 1} / ${words.length} 个词`, `Word ${i + 1} of ${words.length}`)}</div>
      <div class="dict-stage">
        <button class="play-btn" data-play="1" aria-label="${Tp("播放这个单词","Play the word")}">🔊</button>
        <div class="dict-hint">
          <b>${T("点喇叭听写","Tap the speaker")}</b>
          <span>${T("听完在下面输入你听到的单词","Then type the word you hear")}</span>
        </div>
      </div>
      <input class="dict-input" id="dictIn" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="${Tp("在这里输入…","Type the word here…")}" aria-label="${Tp("输入你听到的单词","Type the word you heard")}">
      <div id="dictVerdict"></div>
      <div class="q-nav" id="dictNav">
        <button class="btn" data-dcheck="1">${Tp("检查","Check")}</button>
        <button class="btn ghost" data-dreveal="1">${Tp("家长看词","Show word (parent)")}</button>
      </div>
    </div>`;
  const inp = document.getElementById("dictIn");
  inp.focus();
  inp.addEventListener("keydown", e => { if (e.key === "Enter") checkDict(); });
  playDict();
}

function playDict() {
  const w = dict.words[dict.i];
  const ok = say([w[0], w[1], w[0]]);
  if (!ok) {
    const v = document.getElementById("dictVerdict");
    if (v && !dict.revealed) v.innerHTML = `<div class="verdict"><b>这台设备不支持语音朗读</b>
      <p>请家长点「家长看词」，把单词和例句念给孩子听 —— 这样其实更接近真实考场。</p></div>`;
  }
}

function checkDict() {
  if (dict.answered) return;
  const inp = document.getElementById("dictIn");
  const val = (inp.value || "").trim();
  if (!val) { inp.focus(); return; }
  const w = dict.words[dict.i];
  const ok = val.toLowerCase() === w[0].toLowerCase();
  dict.answered = true;
  dict.results[dict.i] = ok;
  if (!ok) {
    progress.spell[w[0]] = (progress.spell[w[0]] || 0) + 1;
    save();
  }
  inp.disabled = true;
  inp.classList.add(ok ? "good" : "bad");

  document.getElementById("dictVerdict").innerHTML = `
    <div class="verdict ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ " + cheer() : Tp("✗ 正确拼写是 " + w[0], "✗ The spelling is " + w[0])}</b>
      <p><em>${esc(w[1])}</em></p>
      ${ok ? "" : `<span class="src">这个词已记入错词表，下一轮会再考一次</span>`}
    </div>`;

  const last = dict.i === dict.words.length - 1;
  document.getElementById("dictNav").innerHTML =
    `<button class="btn" data-dnext="1">${last ? Tp("看成绩","See score") : Tp("下一个 →","Next →")}</button>`;
  document.querySelectorAll(".dot")[dict.i].className = "dot " + (ok ? "ok" : "no") + " now";
}

function nextDict() {
  if (dict.i === dict.words.length - 1) return finishDict();
  dict.i++; dict.answered = false; dict.revealed = false;
  renderDict();
}

function finishDict() {
  const total = dict.words.length, right = dict.results.filter(Boolean).length;
  touchStreak(); markTask("dict");
  checkAllDone();
  if (right === total) toast(earn("speller"));
  const wrongs = dict.words.filter((_, n) => !dict.results[n]);
  view.innerHTML = `
    <div class="quiz-head">

      <p>${right === total ? Tp("全对！这一级可以往下走了 🐝", "All correct! Time to move up a level 🐝")
        : right >= total - 2 ? Tp("很不错，把错的两个词用五步法再练一遍。", "Nearly there — practise the ones you missed with Look-Say-Cover-Write-Check.")
        : Tp("错得有点多 —— 今天先别加新词，把这 10 个用 Look-Say-Cover-Write-Check 过一遍。", "A few too many — no new words today. Work through these 10 with Look-Say-Cover-Write-Check.")}</p>

        <ul>${wrongs.map(w => `<li><b>${esc(w[0])}</b> — <span style="color:var(--slate)">${esc(w[1])}</span></li>`).join("")}</ul>

    </div>`;
  dict = null;

/* ============================================================
   专项训练 2：乘法口诀抢答（3 分钟限时）
   ============================================================ */
let drill = null;
function startDrill(tables) {
  drill = { tables, i: 0, right: 0, wrong: [], input: "", start: Date.now(), left: 180, q: null, tId: null };
  nextFact();
  drill.tId = setInterval(() => {
    drill.left--;
    const el = document.getElementById("drillClock");
    if (el) {
      el.textContent = fmtTime(drill.left);
      if (drill.left <= 30) el.classList.add("low");
    }
    if (drill.left <= 0) finishDrill();
  }, 1000);
  renderDrill();
}
function fmtTime(s) { const m = Math.floor(s / 60); return m + ":" + String(s % 60).padStart(2, "0"); }
function nextFact() {
  const t = drill.tables[Math.floor(Math.random() * drill.tables.length)];
  const n = 1 + Math.floor(Math.random() * 12);
  drill.q = { a: t, b: n, ans: t * n };
  drill.input = "";
  drill.qStart = Date.now();
}

function renderDrill() {
  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-quitdrill="1">← 结束</button>
      <span class="quiz-title">${T("口诀抢答","Times tables sprint")}</span>
      <span class="clock" id="drillClock">${fmtTime(drill.left)}</span>
    </div>
    <div class="drill-card">
      <div class="drill-score"><b id="drillRight">${drill.right}</b> ${T("题答对","correct")}</div>
      <div class="drill-q" id="drillQ">${drill.q.a} × ${drill.q.b} =</div>
      <div class="drill-in" id="drillIn">${drill.input || "?"}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-key="${n}">${n}</button>`).join("")}
        <button class="key sm" data-key="clr">${Tp("清除","Clear")}</button>
        <button class="key" data-key="0">0</button>
        <button class="key go" data-key="ok">✓</button>
      </div>
    </div>
    <p class="map-note" style="margin-top:14px">${T("目标：3 分钟答对 25 题以上。答对自动跳下一题，不用按确定。","Goal: 25+ correct in 3 minutes. It jumps to the next one automatically when you are right.")}</p>`;
}

function drillKey(k) {
  if (!drill) return;
  if (k === "clr") { drill.input = ""; }
  else if (k === "ok") { return drillSubmit(); }
  else if (drill.input.length < 3) { drill.input += k; }
  document.getElementById("drillIn").textContent = drill.input || "?";
  if (drill.input && +drill.input === drill.q.ans) drillSubmit();
}

function drillSubmit() {
  if (!drill.input) return;
  const ok = +drill.input === drill.q.ans;
  const el = document.getElementById("drillIn");
  if (ok) {
    drill.right++;
    document.getElementById("drillRight").textContent = drill.right;
    el.classList.add("hit");
    setTimeout(() => {
      if (!drill) return;
      el.classList.remove("hit");
      nextFact();
      document.getElementById("drillQ").textContent = drill.q.a + " × " + drill.q.b + " =";
      document.getElementById("drillIn").textContent = "?";
    }, 180);
  } else {
    drill.wrong.push(drill.q.a + " × " + drill.q.b + " = " + drill.q.ans);
    el.classList.add("miss");
    setTimeout(() => {
      if (!drill) return;
      el.classList.remove("miss");
      drill.input = "";
      document.getElementById("drillIn").textContent = "?";
    }, 450);
  }
}

function finishDrill() {
  if (!drill) return;
  clearInterval(drill.tId);
  const right = drill.right, wrong = drill.wrong.slice(0, 12);
  const best = Math.max(progress.drill.best || 0, right);
  const isBest = right > (progress.drill.best || 0);
  progress.drill.best = best;
  progress.drill.runs = (progress.drill.runs || []).concat([{ right, at: Date.now() }]).slice(-20);
  save(); touchStreak(); markTask("drill");
  addCoins(right * 3 + (right >= 25 ? 40 : 0), "drill");
  checkAllDone();
  if (right >= 25) toast(earn("times"));

  view.innerHTML = `
    <div class="quiz-head">

/* ============================================================
   专项训练 3：限时测验（模拟考试节奏，中途不给答案）
   ============================================================ */
let exam = null;
function startExam(subj, n, mins) {
  const pool = [];
  BANK[subj].groups.forEach(g => g.qs.forEach((q, i) => pool.push({ kp: g.kp, i, q })));
  pool.sort(() => Math.random() - .5);
  exam = { subj, qs: pool.slice(0, Math.min(n, pool.length)), i: 0, picks: [], left: mins * 60, total0: mins * 60, tId: null };
  exam.tId = setInterval(() => {
    exam.left--;
    const el = document.getElementById("examClock");
    if (el) { el.textContent = fmtTime(exam.left); if (exam.left <= 60) el.classList.add("low"); }
    if (exam.left <= 0) finishExam();
  }, 1000);
  renderExam();
}

function renderExam() {
  const { qs, i, picks } = exam;
  const item = qs[i];
  const q = item.q;
  const isReading = exam.subj === "reading";
  const txt = isReading && q.t ? READING_TEXTS[q.t] : null;
  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-quitexam="1">← 结束</button>
      <span class="quiz-title">${T("限时测验","Timed test")} · ${lang==="zh"?BANK[exam.subj].label:BANK[exam.subj].en}</span>
      <span class="clock" id="examClock">${fmtTime(exam.left)}</span>
    </div>
    ${txt ? `<div class="passage"><h4>${T(esc(txt.type) + " " + esc(txt.typeZh || ""), esc(txt.type))} — ${esc(txt.title)}</h4>${txt.html}</div>` : ""}
    <div class="q-card">
      <div class="q-meta">${Tp(`第 ${i + 1} / ${qs.length} 题`, `Question ${i + 1} of ${qs.length}`)} · ${T("中途不显示对错，交卷后一次看","no answers shown until you finish")}</div>
      <p class="q-text ${isReading ? "serif" : ""}">${q.q}</p>
      <div class="opts">
        ${q.o.map((o, n) => `<button class="opt ${picks[i] === n ? "chosen" : ""}" data-epick="${n}">
          <span class="letter">${"ABCD"[n]}</span><span class="body">${o}</span>
        </button>`).join("")}
      </div>
      <div class="q-nav">
        <button class="btn ghost" data-emove="-1" ${i === 0 ? "disabled" : ""}>← ${Tp("上一题","Back")}</button>
        ${i === qs.length - 1
          ? `<button class="btn" data-esubmit="1">${Tp("交卷","Finish")}</button>`
          : `<button class="btn" data-emove="1">${Tp("下一题","Next")} →</button>`}
        <span class="kp-count" style="margin-left:auto">${T("已答","Done")} ${picks.filter(x => x !== undefined).length}/${qs.length}</span>
      </div>
    </div>`;
}

function finishExam() {
  if (!exam) return;
  clearInterval(exam.tId);
  const byKp = {};
  let right = 0;
  exam.qs.forEach((item, n) => {
    const ok = exam.picks[n] === item.q.a;
    if (ok) right++;
    byKp[item.kp] = byKp[item.kp] || { r: 0, t: 0 };
    byKp[item.kp].t++; if (ok) byKp[item.kp].r++;
    if (ok) markRight(exam.subj, item.kp, item.i);
    else markWrong(exam.subj, item.kp, item.i);
  });
  const total = exam.qs.length, pct = Math.round(right / total * 100);
  const used = Math.max(0, (exam.total0 || 0) - Math.max(0, exam.left));
  const timedOut = exam.left <= 0;
  progress.tests = (progress.tests || []).concat([{ subj: exam.subj, right, total, at: Date.now() }]).slice(-20);
  save(); touchStreak(); checkMilestones(); markTask("exam");
  checkAllDone(); renderTabs();

  const rows = Object.entries(byKp).sort((a, b) => (a[1].r / a[1].t) - (b[1].r / b[1].t))
    .map(([kp, s]) => {
      const p = Math.round(s.r / s.t * 100);
      return `<tr><td>${esc(kp)}</td><td class="num">${s.r}/${s.t}</td>
        <td><span class="pill ${p >= 85 ? "done" : p >= 60 ? "mid" : "weak"}">${p}%</span></td></tr>`;
    }).join("");

  view.innerHTML = `
    <div class="quiz-head">
      <button class="back" data-tab2="train">← 专项训练</button>
      <span class="quiz-title">${T("限时测验 · 成绩","Test results")}</span>
    </div>
    <div class="score-card">
      <div class="score-big">${right}<span style="font-size:1.4rem;color:var(--slate)">/${total}</span></div>
      <p>正确率 ${pct}% ${timedOut ? "· ⏰ 时间到" : "· 用时 " + fmtTime(used)}<br>
      ${pct >= 85 ? Tp("这一科状态很好。", "This subject is in good shape.")
        : pct >= 70 ? Tp("接近 Strong 水平，把下面正确率低的知识点补一补。", "Close to Strong — top up the weaker topics listed below.")
        : Tp("别急 —— 按下面的表，从最低的那一行开始补。", "No rush — start with the bottom row of the table below and work up.")}</p>
      <div class="q-nav" style="justify-content:center">
        <button class="btn" data-tab2="wrong">${Tp("去错题本","See my mistakes")}</button>
        <button class="btn ghost" data-tab2="train">${Tp("再测一次","Test again")}</button>
      </div>
    </div>
    <p class="eyebrow">${T("分知识点表现（从最弱排起）","How you went, topic by topic (weakest first)")}</p>
    <div class="panel scroll-x">
      <table><thead><tr><th>${T("知识点","Topic")}</th><th class="num">${T("得分","Score")}</th><th>${T("正确率","Correct")}</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  exam = null;
}

        </button>`).join("")}
      </div>
      <div id="verdict"></div>

function reviewPick(n) {
  if (review.answered) return;
  review.answered = true;
  const item = review.list[review.i], q = item.q, ok = n === q.a;
  review.results[review.i] = ok;
  if (ok) {
    const before = progress.wrong[wrongKey(item.subj, item.kp, item.i)];
    const wasStreak = before ? before.streak || 0 : 0;
    markRight(item.subj, item.kp, item.i);
    if (wasStreak + 1 >= 2) {
      progress.cleared = (progress.cleared || 0) + 1;
      progress.beaten = (progress.beaten || []).concat([{ s: item.subj, k: item.kp, i: item.i, at: Date.now() }]).slice(-60);
    }
    save();
  } else markWrong(item.subj, item.kp, item.i);
  renderTabs();

  document.querySelectorAll("#opts .opt").forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.a) b.classList.add("correct");
    else if (idx === n) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const cleared = ok && (progress.wrong[wrongKey(item.subj, item.kp, item.i)] === undefined);
  const wNow = progress.wrong[wrongKey(item.subj, item.kp, item.i)];
  document.getElementById("verdict").innerHTML = `
    <div class="verdict ${ok ? "good" : "bad"}">
      <b>${ok ? "✓ " + cheer() : Tp("✗ 正确答案是 " + "ABCD"[q.a], "✗ The answer is " + "ABCD"[q.a])}</b>
      <p>${TB(q.e, EN_EXP[q.s])}</p>
      <span class="src">${cleared
        ? Tp("🎉 四关全过，这道题真正学会了", "🎉 All four stages passed — this one is really learnt")
        : ok ? Tp("很好 —— " + INTERVALS[(wNow.box || 1) - 1] + " 天后会再考你一次", "Nice — it will come back in " + INTERVALS[(wNow.box || 1) - 1] + " day(s)")
             : Tp("别急，讲解再读一遍，下次一定行", "Read the explanation again — you'll get it next time")} · ${SRC(q.s)}</span>
    </div>`;
  const last = review.i === review.list.length - 1;
  document.getElementById("qnav").innerHTML =
    `<button class="btn" data-rnext="1">${last ? Tp("完成","Done") : Tp("下一题 →","Next →")}</button>`;
  document.querySelectorAll(".dot")[review.i].className = "dot " + (ok ? "ok" : "no") + " now";
}

function reviewNext() {
  if (review.i === review.list.length - 1) {
    touchStreak(); checkMilestones(); markTask("review");
    checkAllDone();
    if ((progress.cleared || 0) >= 5) toast(earn("fixer"));
    review = null;
    return renderWrong();
  }
  review.i++; review.answered = false; renderReview();
}

        <div class="stat"><div class="k">${T("等待间隔中","Resting")}</div><div class="v">${list.length - due.length}<small> ${Tp("题","Q")}</small></div></div>
        <div class="stat"><div class="k">${T("已清除","Cleared")}</div><div class="v">${progress.cleared || 0}<small> ${Tp("题","Q")}</small></div></div>
        <div class="stat"><div class="k">${T("错词","Tricky words")}</div><div class="v">${spellWrong.length}<small> 个</small></div></div>
      </div>
      <div class="q-nav" style="margin:0 0 22px">
        <button class="btn" data-review="1">${Tp(due.length ? "复习今天到期的 " + Math.min(15, due.length) + " 题" : "提前练一练", due.length ? "Review " + Math.min(15, due.length) + " due today" : "Practise ahead")}</button>
      </div>
      ${Object.entries(bySubj).map(([subj, ws]) => `
        <p class="eyebrow">${esc(BANK[subj].label)}（${ws.length} 题）</p>
        <div class="panel" style="padding:6px 16px">
          ${ws.map(w => `<div class="wrong-row">
            <div>
              <div class="wr-q">${w.q.q.replace(/<[^>]+>/g, "")}</div>
              <div class="wr-meta">${esc(lang === "zh" ? w.kp : (BANK[w.subj].groups.find(g => g.kp === w.kp) || {}).en || w.kp)} · ${SRC(w.q.s)}</div>

          </div>`).join("")}
        </div>`).join("")}
    ` : `<div class="panel"><p class="sub" style="margin:0">${T("错题本是空的。去练习或做限时测验，做错的题会自动收进来。","Nothing here yet. Do some practice or a timed test — anything you get wrong lands here automatically.")}</p></div>`}

    ${spellWrong.length ? `

      </div>` : ""}`;
}

          <div class="m-use"><b>${T("在家怎么用", "How to use it at home")}</b>${TB(esc(m.use), esc(m.enUse))}</div>
        </div>`).join("")}
    `).join("")}`;
}

   （交替 interleaving 比一科刷到底更利于长期保持）

  ["numeracy", "位值与比大小"], ["conventions", "词类"],       ["reading", "字面理解"],
  ["numeracy", "加减法"],       ["conventions", "动词时态"],
  ["numeracy", "乘除法"],       ["conventions", "主谓一致"],   ["reading", "词义与比喻"],

  ["numeracy", "图表与数据"],   ["numeracy", "可能性"]
];

/* 三阶段：3 个月学完 → 3 个月复习 → 考前冲刺 */
const PHASES = [
  { id: "learn",  from: "2026-08-01", to: "2026-10-31",
    zh: "学习期", en: "Learning",
    zhD: "3 个月学完全部 29 个知识点，并且每个都练两遍",
    enD: "Cover all 29 topics in 3 months, and practise each one twice" },
  { id: "revise", from: "2026-11-01", to: "2027-01-31",
    zh: "复习期", en: "Revision",
    zhD: "3 个月清错题、升级听写、每周一次限时测验",
    enD: "3 months of clearing mistakes, harder dictation and a timed test each week" },
  { id: "final",  from: "2027-02-01", to: "2027-03-10",
    zh: "考前冲刺", en: "Final weeks",
    zhD: "只做模拟卷和错题，不学新内容",
    enD: "Mock papers and your mistakes only — nothing new" }
];
function currentPhase() {
  const t = todayKey();
  return PHASES.find(p => t >= p.from && t <= p.to) || (t < PHASES[0].from ? PHASES[0] : PHASES[2]);
}
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }

function todayKey() { return new Date().toISOString().slice(0, 10); }
function planState() {
  if (!progress.plan) progress.plan = { done: {}, writes: 0 };
  if (!progress.plan.done) progress.plan.done = {};
  return progress.plan;
}
function doneToday() { return planState().done[todayKey()] || []; }
function markTask(id) {
  const pl = planState(), k = todayKey();
  pl.done[k] = pl.done[k] || [];
  if (!pl.done[k].includes(id)) pl.done[k].push(id);
  save();
}
/* 已学过的知识点数量（有过练习记录即算） */
function learnedCount() { return CURRICULUM.filter(([s, k]) => kpStat(s, k).total > 0).length; }
function nextNewKp() { return CURRICULUM.find(([s, k]) => kpStat(s, k).total === 0) || null; }
/* 已完成学习的天数（有任何任务完成即算一天） */
function activeDays() { return Object.keys(planState().done).filter(d => planState().done[d].length).length; }

/* 今天该做什么（按阶段分化） */
function weakestKp(threshold) {
  return CURRICULUM.map(([s, k]) => ({ s, k, st: kpStat(s, k) }))
    .filter(x => x.st.total && x.st.right / x.st.total < threshold)
    .sort((a, b) => (a.st.right / a.st.total) - (b.st.right / b.st.total))[0];
}
/* 当天任务一旦生成就锁定，做完能看到打勾，不会立刻被下一个替换 */
function dayAssign() {
  const pl = planState(), k = todayKey();
  pl.assign = pl.assign || {};
  if (!pl.assign[k]) {
    const nk = nextNewKp(), w9 = weakestKp(.9), w95 = weakestKp(.95);
    pl.assign[k] = {
      d: activeDays() + 1,
      newKp: nk || null,
      weak9: w9 ? [w9.s, w9.k] : null,
      weak95: w95 ? [w95.s, w95.k] : null
    };
    save();
  }
  return pl.assign[k];
}

function todayTasks() {
  const done = doneToday();
  const A = dayAssign();
  const d = A.d;
  const wrongs = dueList().length;
  const ph = currentPhase().id;
  const t = [];

  /* 每天都做：口诀 3 分钟 */
  t.push({ id: "drill", icon: "⚡", min: 3,
    zh: "乘法口诀抢答 3 分钟", en: "Times tables sprint · 3 minutes",
    zhWhy: "数学不许用计算器，口诀不熟会拖慢所有题", enWhy: "No calculator in the maths test — slow tables slow everything down",
    go: { drill: "2,3,5,10" } });

  if (ph === "learn") {
    const nk = A.newKp;
    if (nk) {
      const g = BANK[nk[0]].groups.find(x => x.kp === nk[1]);
      t.push({ id: "kp:" + nk[0] + ":" + nk[1], icon: "📘", min: 10,
        zh: "新知识点：" + nk[1] + "（" + g.qs.length + " 题）",
        en: "New topic: " + g.en + " (" + g.qs.length + " questions)",
        zhWhy: "29 个知识点里的第 " + (learnedCount() + 1) + " 个",
        enWhy: "Topic " + (learnedCount() + 1) + " of 29",
        go: { quiz: nk[0], kp: nk[1] } });
    } else if (A.weak9) {
      const w = { s: A.weak9[0], k: A.weak9[1] };
      {
        const g = BANK[w.s].groups.find(x => x.kp === w.k);
        t.push({ id: "kp:" + w.s + ":" + w.k, icon: "🔁", min: 10,
          zh: "第二遍：" + w.k, en: "Second pass: " + g.en,
          zhWhy: "29 个都学过了，现在从最弱的开始过第二遍", enWhy: "All 29 covered — now the second pass, weakest first",
          go: { quiz: w.s, kp: w.k } });
      }
    }
  }

  if (ph === "revise") {
    const w = A.weak95 ? { s: A.weak95[0], k: A.weak95[1] } : null;
    if (w) {
      const g = BANK[w.s].groups.find(x => x.kp === w.k);
      t.push({ id: "kp:" + w.s + ":" + w.k, icon: "🔁", min: 10,
        zh: "补弱项：" + w.k, en: "Top up: " + g.en,
        zhWhy: "复习期的重点：把正确率没到 95% 的知识点逐个清掉", enWhy: "Revision focus: clear every topic still under 95%",
        go: { quiz: w.s, kp: w.k } });
    }
    if (d % 5 === 0) t.push({ id: "exam", icon: "⏱️", min: 15,
      zh: "限时测验一次（数学 20 题 / 15 分钟）", en: "One timed test (Maths, 20 questions in 15 min)",
      zhWhy: "复习期每周一次，练的是考试节奏不是知识", enWhy: "Once a week in revision — this trains test pace, not knowledge",
      go: { exam: "numeracy,20,15" } });
  }

  if (ph === "final") {
    t.push({ id: "review", icon: "🔧", min: 10,
      zh: "只做错题本（" + wrongs + " 道待攻克）", en: "Mistakes only (" + wrongs + " to fix)",
      zhWhy: "考前最后阶段不学新内容，只清错题", enWhy: "Nothing new this close to the test — just clear what you got wrong",
      go: { review: 1 } });
    if (d % 4 === 0) t.push({ id: "exam", icon: "⏱️", min: 12,
      zh: "限时测验（语言规范 20 题 / 12 分钟）", en: "Timed test (Language, 20 questions in 12 min)",
      zhWhy: "保持手感，别让节奏生疏", enWhy: "Keep the rhythm sharp",
      go: { exam: "conventions,20,12" } });
  }

  if (ph !== "final" && wrongs >= 5) t.push({ id: "review", icon: "🔧", min: 6,
    zh: "重做错题（" + wrongs + " 道待攻克）", en: "Redo mistakes (" + wrongs + " to fix)",
    zhWhy: "按 1/3/7/21 天的间隔重考，这样记得最牢", enWhy: "They come back at 1, 3, 7 and 21 day gaps — the way memory sticks best",
    go: { review: 1 } });

  /* 听写：学习期每 3 天一次，复习期起每 2 天一次并升级难度 */
  const every = ph === "learn" ? 3 : 2;
  if (d % every === 0) {
    const lv = ph === "learn" ? Math.min(1, Math.floor(d / 20)) : ph === "revise" ? 2 : 3;
    t.push({ id: "dict", icon: "🐝", min: 5,
      zh: "拼写听写 10 个词（" + SPELL[lv].lv + "）", en: "Spelling dictation · 10 words (" + SPELL[lv].lvEn + ")",
      zhWhy: "拼写占语言规范 15/40 题", enWhy: "Spelling is 15 of the 40 Language questions",
      go: { dict: lv } });
  }

  /* 拓展题：已学过的知识点掌握得好时出现 */
  const mastered = CURRICULUM.filter(([a, k]) => { const st = kpStat(a, k); return st.total && st.right / st.total >= .85; }).length;
  if (mastered >= 3 && d % 2 === 0) {
    const cg = BANK.challenge.groups.filter(g => kpStat("challenge", g.kp).total === 0)[0]
            || BANK.challenge.groups.map(g => ({ g, st: kpStat("challenge", g.kp) }))
                 .sort((a, b) => (a.st.right / a.st.total) - (b.st.right / b.st.total))[0].g;
    t.push({ id: "kp:challenge:" + cg.kp, icon: "🚀", min: 8,
      zh: "拓展题：" + cg.kp + "（6 题，金币 ×1.5）", en: "Challenge: " + cg.en + " (6 questions, 1.5× coins)",
      zhWhy: "仍在 Year 3 范围内，但题型更难 —— 拿 Exceeding 靠的就是这些",
      enWhy: "Still Year 3 content, but the harder question types — this is what Exceeding is built on",
      go: { quiz: "challenge", kp: cg.kp } });
  }

  if (d % 10 === 0) t.push({ id: "write", icon: "✏️", min: 40,
    zh: "整篇作文一次（严格 40 分钟）", en: "One full piece of writing (strict 40 minutes)",
    zhWhy: "写作是唯一的纸笔科目，要在真的作文纸上手写", enWhy: "Writing is the only pen-and-paper paper — do it on real lined paper",
    go: { tab: "writing" } });

  return t;
}

const EDGE_KIND = {
  pre:  { n: "前置", en: "Learn first", d: "先会 A 才学得动 B", de: "Learn A before you can do B", col: "var(--slate)",  dash: "" },
  same: { n: "跨科同源", en: "Same idea", d: "不同科目里其实是同一个概念", de: "The same idea in a different subject", col: "var(--wattle)", dash: "7 5" },
  mix:  { n: "易混", en: "Easy to mix up", d: "容易搞混，必须放一起对照记", de: "Easy to confuse — learn them side by side", col: "var(--coral)", dash: "2 5" },
  use:  { n: "用到", en: "Used in", d: "B 要用到 A", de: "B needs A", col: "var(--sky)", dash: "" }
};

const NODE_BY_ID = {};
NODES.forEach(nd => {
  const [id, cl, name, col, row, tip, kp] = nd;
  const C = CLUSTERS[cl];
  NODE_BY_ID[id] = { id, cl, name, tip, kp, x: C.ox + col * COL_W + 82, y: C.oy + row * ROW_H };
});

let graphSel = null, graphFilter = "all";

function neighbours(id) {
  return EDGES.filter(e => e[0] === id || e[1] === id)
    .map(e => ({ other: e[0] === id ? e[1] : e[0], type: e[2], why: e[3], from: e[0] === id }));
}

function graphSvg() {
  const W = 1132, H = 726;
  const shown = EDGES.filter(e => graphFilter === "all" || e[2] === graphFilter);
  const active = graphSel ? new Set([graphSel, ...neighbours(graphSel).map(n => n.other)]) : null;

  const edges = shown.map(e => {
    const a = NODE_BY_ID[e[0]], b = NODE_BY_ID[e[1]], k = EDGE_KIND[e[2]];
    const on = !active || (active.has(e[0]) && active.has(e[1]));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const far = Math.abs(a.x - b.x) > 260 || Math.abs(a.y - b.y) > 200;
    const d = far
      ? `M${a.x} ${a.y} Q ${mx + (b.y - a.y) * .14} ${my - (b.x - a.x) * .14} ${b.x} ${b.y}`
      : `M${a.x} ${a.y} L${b.x} ${b.y}`;
    return `<path d="${d}" fill="none" stroke="${k.col}" stroke-width="${on ? (e[2] === "same" ? 2.6 : 2) : 1.2}"
      stroke-dasharray="${k.dash}" opacity="${on ? (active ? .95 : .5) : .07}"
      ${e[2] === "pre" || e[2] === "use" ? 'marker-end="url(#ar-' + e[2] + ')"' : ""}></path>`;
  }).join("");

  const nodes = NODES.map(nd => {
    const n = NODE_BY_ID[nd[0]], C = CLUSTERS[n.cl];
    const on = !active || active.has(n.id);
    const sel = graphSel === n.id;
    const label = (lang === "zh" || !EN_NODE[n.id]) ? n.name : EN_NODE[n.id][0];
    const w = Math.max(76, label.replace(/[^\x00-\xff]/g, "aa").length * 7.4 + 22);
    return `<g class="gnode ${on ? "" : "off"} ${sel ? "sel" : ""}" data-node="${n.id}" tabindex="0" role="button"
        aria-label="${esc(label)}" transform="translate(${n.x} ${n.y})">
      <rect x="${-w / 2}" y="-17" width="${w}" height="34" rx="17"
        fill="var(--${C.c}-soft)" stroke="var(--${C.c})" stroke-width="${sel ? 3 : 1.5}"></rect>
      <text y="5" text-anchor="middle" fill="var(--${C.c})" font-size="14.5" font-weight="650">${esc(label)}</text>
    </g>`;
  }).join("");

  const labels = Object.entries(CLUSTERS).map(([k, C]) =>
    `<text x="${C.ox + 10}" y="${C.oy - 34}" fill="var(--${C.c})" font-size="19" font-weight="750"
      opacity=".85">${esc(lang === "zh" ? C.label
        : { r: "Reading", w: "Writing", c: "Language", n: "Maths" }[k])}</text>`).join("");

  const arrows = ["pre", "use"].map(t =>
    `<marker id="ar-${t}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="${EDGE_KIND[t].col}"></path></marker>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="NAPLAN Year 3 知识图谱"><defs>${arrows}</defs>
    ${labels}${edges}${nodes}</svg>`;
}

function graphDetail() {
  if (!graphSel) {
    return `<div class="g-detail empty-detail">
      <b>${T("点任意一个概念看它的关联","Tap any idea to see what it connects to")}</b>
      <p>${TB("这张图的价值不在「有哪些知识点」，而在<strong>知识点之间的关系</strong>：哪些要先学、哪些在不同科目里其实是同一个东西、哪些最容易搞混。",
        "What matters here is not the list of topics but the <strong>links between them</strong>: which ones to learn first, which are the same idea wearing another subject's clothes, and which are easiest to mix up.")}</p></div>`;
  }
  const n = NODE_BY_ID[graphSel];
  const ns = neighbours(graphSel);
  const byType = {};
  ns.forEach(x => (byType[x.type] = byType[x.type] || []).push(x));
  return `<div class="g-detail" style="--acc:var(--${CLUSTERS[n.cl].c});--acc-soft:var(--${CLUSTERS[n.cl].c}-soft)">
    <div class="gd-head">
      <div>
        <span class="gd-cl">${esc(CLUSTERS[n.cl].label)}</span>
        <div class="gd-name">${T(esc(n.name), esc((EN_NODE[n.id] || [n.name])[0]))}</div>
      </div>
      ${n.kp ? `<button class="btn" data-quiz="${n.kp[0]}" data-kp="${esc(n.kp[1])}">${Tp("去练这个知识点","Practise this")} →</button>` : ""}
    </div>
    <p class="gd-tip">${TB(esc(n.tip), EN_NODE[n.id] ? esc(EN_NODE[n.id][1]) : "")}</p>
    ${Object.entries(byType).map(([t, list]) => `
      <div class="gd-rel">
        <div class="gd-rel-h"><span class="dotk" style="background:${EDGE_KIND[t].col}"></span>
          ${T(EDGE_KIND[t].n, EDGE_KIND[t].en)}<em>${T(EDGE_KIND[t].d, EDGE_KIND[t].de)}</em></div>
        ${list.map(x => `<button class="gd-item" data-node="${x.other}">
          <b>${t === "pre" && x.from ? "→ " : t === "pre" ? "← " : ""}${
            lang === "zh" || !EN_NODE[x.other] ? esc(NODE_BY_ID[x.other].name) : esc(EN_NODE[x.other][0])}</b>
          <span>${esc(x.why)}</span></button>`).join("")}
      </div>`).join("")}
  </div>`;
}

function renderGraph() {
  const kinds = [["all", "全部关系", "All links"], ["pre", "前置链", "Learn first"], ["same", "跨科同源", "Same idea"], ["mix", "易混对照", "Easy to mix up"], ["use", "用到", "Used in"]];
  view.innerHTML = `
    <h2>${T("知识图谱","Knowledge Map")}<span class="en">${ZH("知识图谱") || "Knowledge graph"}</span></h2>
    <p class="lede">${TB("52 个概念、" + EDGES.length + " 条关系。<strong>点任意一个概念</strong>，图上只亮起和它有关系的部分，下面给出每条关系的解释。按关系记忆，比按清单背诵牢得多。",
      "52 ideas and " + EDGES.length + " links. <strong>Tap any idea</strong> — the map lights up only what is connected to it, and every link is explained below. Learning by connections sticks far better than learning by lists.")}</p>

      </div>

        ${Object.entries(EDGE_KIND).map(([k, v]) =>

            lang === "zh" ? v.n : v.en}</span>`).join("")}

    <div class="g-wrap" id="gWrap">${graphSvg()}</div>

    ${graphDetail()}

    <p class="eyebrow">${T("最值得记的 5 条跨科关系","The 5 cross-subject links most worth remembering")}</p>
    <div class="panel">
      <ol class="m-steps">
        <li><b>${T("不规则过去式 → 写记叙文", "Irregular past tenses → writing a narrative")}</b><span>${TB("故事全用过去式。went/saw/came 背不熟，作文里就会写成 goed/seed。这是语言规范和写作的同一块地基。", "Stories are told in the past tense. If went, saw and came are not solid, they turn into goed and seed in your writing. Language and Writing rest on the same foundation here.")}</span></li>
        <li><b>${T("阅读的五种文体 = 写作的两种体裁", "The five reading text types = the two writing types")}</b><span>${TB("阅读课上拆解 Narrative 怎么写开头结尾，正是自己写故事时要用的结构。读和写是一件事。", "Pulling apart how a narrative opens and closes in reading is exactly the structure you use when writing your own. Reading and writing are one job.")}</span></li>
        <li><b>${T("连接词出现在三个科目", "Connectives turn up in three subjects")}</b><span>${TB("阅读考「However 表示什么」，写作要用 Firstly/Finally，语法考 because/but/or —— 同一批词，三处得分。", "Reading asks what However signals, Writing needs Firstly and Finally, Grammar tests because, but and or — one set of words, marks in three places.")}</span></li>
        <li><b>${T("数学信号词 = 阅读圈关键词", "Maths signal words = circling key words in Reading")}</b><span>${TB("altogether / each / left 和阅读题里的 NOT / MOST 一样，都是「先圈出来再答题」的同一个习惯。", "altogether, each and left work just like NOT and MOST in reading questions — the same habit of circling first, answering second.")}</span></li>
        <li><b>${T("写作的标点拼写分 = 语言规范题", "Writing's punctuation and spelling marks = the Language paper")}</b><span>${TB("写作 10 项里标点占 5 分、拼写占 6 分。练语言规范题，等于同时在给作文提分。", "Of the 10 writing criteria, punctuation is worth 5 marks and spelling 6. Every Language question you practise is also lifting your writing score.")}</span></li>
      </ol>
    </div>`;

  const wrap = document.getElementById("gWrap");
  if (wrap) {
    const svg = wrap.querySelector("svg");
    if (graphSel && svg) {
      const scale = (svg.getBoundingClientRect().width || 1132) / 1132;
      wrap.scrollLeft = NODE_BY_ID[graphSel].x * scale - wrap.clientWidth / 2;
    } else if (svg) wrap.scrollLeft = 0;
  }
}

const STORY = [

["Nobody Else Can See It","At school on Monday, Tilly put the key on her desk and asked Priya what she thought it opened.\n\"What key?\" said Priya.\nTilly looked down. The key was right there, lying on her maths book.\n\"That one,\" she said.\nPriya laughed and went to line up. Tilly did not laugh. She put the key in her pocket and kept her hand around it all afternoon."],
["The Door Under the Stairs","There was a cupboard under the stairs at Tilly's grandmother's house. It had no handle and no lock, and Tilly had walked past it a thousand times.\nOn Saturday she stood in front of it with the key in her fist and felt ridiculous.\nThen a keyhole appeared in the wood. It did not fade in slowly. It was simply there, as if it had always been there and she had never once looked."],

["Through","The door opened onto grass.\nNot a room. Grass, and a low grey sky, and a wind that smelled like rain that had not arrived yet. Behind her, the cupboard door stood open in the middle of a field with nothing holding it up.\nTilly checked the small clock in her pocket. Two minutes past eleven.\nShe walked."],

function chaptersUnlocked() { return Math.min(STORY.length, (progress.chapters || 0)); }
function unlockChapter() {
  if ((progress.chapters || 0) >= STORY.length) return null;
  progress.chapters = (progress.chapters || 0) + 1;
  save();
  return progress.chapters;
}

    if (!g || !g.qs[b.i]) return null;
    return { ...b, q: g.qs[b.i], gEn: g.en };

function daysAgo(ts) { return Math.max(1, Math.round((Date.now() - ts) / 864e5)); }

/* ============================================================
   她当小老师：讲给家长听
   ============================================================ */
function teachCards() {
  return CURRICULUM.map(([sub, kp]) => {
    const st = kpStat(sub, kp);
    if (!st.total || st.right / st.total < .85) return null;
    const g = BANK[sub].groups.find(x => x.kp === kp);
    return { sub, kp, en: g.en, tip: g.tip, tipEn: EN_TIP[kp] || "",
             taught: (progress.taught || {})[sub + "::" + kp] };
  }).filter(Boolean);
}
function markTaught(sub, kp) {
  progress.taught = progress.taught || {};
  const k = sub + "::" + kp;
  if (progress.taught[k]) delete progress.taught[k]; else progress.taught[k] = Date.now();
  save(); renderRewards();
}

/* ============================================================
   云同步（可选）：配置后任何设备自动同步进度
   在 artifact 沙箱里网络被禁用，这段代码会静默失败并退回本地存储
   ============================================================ */
const SYNC_KEY = "chloe-sync-cfg";
let syncCfg = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch (e) { return null; } })();
let syncState = { on: false, busy: false, last: null, err: null };

function saveSyncCfg(c) {
  syncCfg = c;
  try { c ? localStorage.setItem(SYNC_KEY, JSON.stringify(c)) : localStorage.removeItem(SYNC_KEY); } catch (e) {}
}
function syncReady() { return !!(syncCfg && syncCfg.url && syncCfg.key && syncCfg.code); }
function syncHeaders() {
  return { "apikey": syncCfg.key, "Authorization": "Bearer " + syncCfg.key,
           "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates,return=minimal" };
}
function syncUrl(q) { return syncCfg.url.replace(/\/+$/, "") + "/rest/v1/progress" + (q || ""); }

async function syncPull() {
  if (!syncReady()) return null;
  const r = await fetch(syncUrl("?code=eq." + encodeURIComponent(syncCfg.code) + "&select=data,updated_at"),
    { headers: syncHeaders() });
  if (!r.ok) throw new Error("pull " + r.status);
  const rows = await r.json();
  return rows && rows[0] ? rows[0] : null;
}
async function syncPush() {
  if (!syncReady()) return;
  progress.updatedAt = Date.now();
  const r = await fetch(syncUrl(), {
    method: "POST", headers: syncHeaders(),
    body: JSON.stringify([{ code: syncCfg.code, data: progress, updated_at: new Date().toISOString() }])
  });
  if (!r.ok) throw new Error("push " + r.status);
}

let pushTimer = null;
function syncSoon() {
  if (!syncReady()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    syncState.busy = true; paintSync();
    try { await syncPush(); syncState.last = Date.now(); syncState.err = null; }
    catch (e) { syncState.err = String(e.message || e); }
    syncState.busy = false; paintSync();
  }, 4000);
}

/* 粗略衡量一份进度里有多少内容，用来防止「空的覆盖有的」 */
function weightOf(pr) {
  if (!pr) return 0;
  return Object.keys(pr.kp || {}).length * 10
       + Object.keys((pr.plan || {}).done || {}).length * 5
       + Object.keys(pr.wrong || {}).length
       + (pr.chapters || 0) * 3
       + Math.min(50, (pr.earned || 0) / 10);
}

/* 决定采用云端还是上传本地 —— 连接时和每次打开都走这一段 */
async function syncMerge() {
  const row = await syncPull();
  const remoteAt = row ? new Date(row.updated_at).getTime() : 0;
  const localAt = progress.updatedAt || 0;
  const rW = weightOf(row && row.data), lW = weightOf(progress);
  /* 云端有内容而本机是空的 → 一律采用云端，绝不用空的覆盖 */
  const adopt = row && (rW > 0 && lW === 0 ? true : remoteAt > localAt + 1000);
  if (adopt) {
    progress = row.data || progress;
    for (const k in BLANK) if (progress[k] === undefined) progress[k] = JSON.parse(JSON.stringify(BLANK[k]));
    try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
    render(); updateCoinUI();
    return "pulled";
  }
  if (lW > 0 || !row) { await syncPush(); return "pushed"; }
  return "none";
}

/* 打开页面时：远端更新则采用远端，否则把本地推上去 */
async function syncBoot() {
  if (!syncReady()) return;
  syncState.on = true; syncState.busy = true; paintSync();
  try { await syncMerge(); syncState.last = Date.now(); syncState.err = null; }
  catch (e) { syncState.err = String(e.message || e); }
  syncState.busy = false; paintSync();
}

function paintSync() {
  const el = document.getElementById("syncDot");
  if (!el) return;
  el.className = "sync-dot " + (!syncReady() ? "off" : syncState.busy ? "busy" : syncState.err ? "bad" : "ok");
  el.title = !syncReady() ? Tp("未开启云同步", "Cloud sync off")
    : syncState.busy ? Tp("同步中…", "Syncing…")
    : syncState.err ? Tp("同步失败：" + syncState.err, "Sync failed: " + syncState.err)
    : Tp("已同步", "Synced");
}

function packCfg(c) { try { return btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/=+$/, ""); } catch (e) { return ""; } }
function unpackCfg(t) {
  try { const o = JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
    return (o && o.url && o.key && o.code) ? o : null; } catch (e) { return null; }
}

async function testSync(cfg) {
  const note = document.getElementById("syNote");
  const set = (cls, msg) => { if (note) note.innerHTML = `<span class="${cls}">${msg}</span>`; };
  set("", Tp("正在连接…", "Connecting…"));
  const old = syncCfg;
  syncCfg = cfg;
  try {
    const how = await syncMerge();
    saveSyncCfg(cfg);
    syncState.on = true; syncState.err = null; syncState.last = Date.now();
    set("ok", "✓ " + (how === "pulled"
      ? Tp("连接成功，已从云端取回进度。", "Connected — your progress has been pulled down from the cloud.")
      : Tp("连接成功，本机进度已上传。以后任何设备粘贴连接码即可同步。",
           "Connected — this device's progress is uploaded. Paste the connection code on any other device to join.")));
    paintSync();
  } catch (e) {
    syncCfg = old;
    set("bad", "✗ " + Tp("连接失败：" + (e.message || e) + "。请检查网址、密钥，以及表是否建好。",
      "Failed: " + (e.message || e) + ". Check the URL, the key, and that the table exists."));
  }
}
